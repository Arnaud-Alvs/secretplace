  }).join('');
 
  // ── Sector bars ──
  var secR=sectors.map(function(s){
    var key='sec_'+s.name.replace(/[^a-zA-Z0-9]/g,'_');
    registerDrill(key,'Sector: '+s.name,s.count+' securities',(function(sn){return function(x){return x.sector===sn;};})(s.name));
    return '<div class="brow" onclick="drillNamed(this,\''+key+'\')">'+
      '<span class="bname">'+esc(s.name)+'</span>'+
      '<div class="btrack"><div class="bfill bf0" style="width:'+(s.count/maxC*100)+'%"></div></div>'+
      '<span class="bmeta2">'+s.count+' <span style="color:var(--tier-hc)">'+s.hc+' HC</span></span>'+
      '<span style="font-size:10px;font-weight:700;width:52px;text-align:right;color:'+(s.avgUp>0?'var(--green)':'var(--red)')+'">'+pct(s.avgUp)+'</span>'+
      '</div>';
  }).join('');
 
  return '<div class="macro-wrap" id="macro-wrap">' +
    kpiHtml + tierHtml +
 
    // ── Upside breakdown panel ──
    '<div class="panel" style="margin-bottom:14px">' +
    '<div class="ph"><span class="pht">Average Upside by Tier</span>' +
    '<span class="phh">Based on ' + avgUpCnt + ' securities with a price target / ' + inUniverse.length + ' in the universe</span></div>' +
    '<div class="pb" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0">' +
 
    '<div style="padding:12px 16px;border-right:1px solid var(--border);cursor:pointer" onclick="drillNamed(this,\'hc\')">' +
    '<div style="font-size:8px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--tier-hc);margin-bottom:4px">High Conviction</div>' +
    '<div style="font-size:28px;font-weight:700;color:' + (hcAvgUpV > 0 ? 'var(--green)' : hcAvgUpV < 0 ? 'var(--red)' : 'var(--muted)') + '">' + pct(hcAvgUpV) + '</div>' +
    '<div style="font-size:9px;color:var(--muted);margin-top:3px">' + hcAvgUpObj.cnt + ' securities with PT Override</div></div>' +
 
    '<div style="padding:12px 16px;border-right:1px solid var(--border);cursor:pointer" onclick="drillNamed(this,\'buy\')">' +
    '<div style="font-size:8px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--tier-buy);margin-bottom:4px">Buy — CFRA</div>' +
    '<div style="font-size:28px;font-weight:700;color:' + (buyAvgUpV > 0 ? 'var(--green)' : buyAvgUpV < 0 ? 'var(--red)' : 'var(--muted)') + '">' + pct(buyAvgUpV) + '</div>' +
    '<div style="font-size:9px;color:var(--muted);margin-top:3px">' + buyAvgUpObj.cnt + ' securities with consensus PT</div></div>' +
 
    '<div style="padding:12px 16px;cursor:pointer" onclick="drillNamed(this,\'hold\')">' +
    '<div style="font-size:8px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--tier-hold);margin-bottom:4px">Hold — CFRA</div>' +
    '<div style="font-size:28px;font-weight:700;color:' + (holdAvgUpV > 0 ? 'var(--green)' : holdAvgUpV < 0 ? 'var(--red)' : 'var(--muted)') + '">' + pct(holdAvgUpV) + '</div>' +
    '<div style="font-size:9px;color:var(--muted);margin-top:3px">' + holdAvgUpObj.cnt + ' securities with consensus PT</div></div>' +
 
    '</div></div>' +
    '<div class="three-col">' +
    '<div class="panel"><div class="ph"><span class="pht">By Region</span><span class="phh">click &rarr;</span></div><div class="pb">' +
    '<div class="col-hdr"><span>Region &middot; coverage</span><span style="margin-left:auto">Avg upside</span></div>' + regH + '</div></div>' +
    '<div class="panel"><div class="ph"><span class="pht">Q1 Concentration &mdash; Sector</span><span class="phh">click &rarr;</span></div><div class="pb">' +
    '<div class="col-hdr">' +
      '<span style="width:118px;flex-shrink:0">Sector</span>' +
      '<span style="flex:1">Share in Q1 (line = 25%)</span>' +
      '<span style="margin-left:auto">% (Q1 / total)</span>' +
    '</div>' + qConcH + '</div></div>' +
    '<div class="panel"><div class="ph"><span class="pht">Risk Overview</span><span class="phh">click &rarr;</span></div><div class="pb">' + riskB + '</div></div>' +
    '</div>' +
    (qualCov.length ? '<div class="panel" style="margin-bottom:14px"><div class="ph"><span class="pht">Average Qualitative Scores — HC</span><span class="phh">1 = best · ' + qualCov.length + ' securities covered</span></div><div class="pb"><div class="qscores">' + qualAvgH + '</div></div></div>' : '') +
    '<div class="panel"><div class="ph"><span class="pht">By Sector</span><span class="phh">click &rarr;</span></div><div class="pb">' +
    '<div class="col-hdr">' +
      '<span style="width:130px;flex-shrink:0">Sector</span>' +
      '<span style="flex:1">Universe share</span>' +
      '<span style="width:60px;text-align:right;flex-shrink:0">Count / HC</span>' +
      '<span style="width:52px;text-align:right;flex-shrink:0">Avg upside</span>' +
    '</div>' + secR + '</div></div>' +
    '</div>';
}
 
// ════════════════════════════════════════════════════
// SCREEN VIEW
// ════════════════════════════════════════════════════
/* ════════════════════════════════════════════════════
 * SCREEN COLUMN REGISTRY — single source of truth for the universe table.
 * Each entry defines the header (label + sort key + optional sub-label and
 * alignment) and the cell renderer. `when` gates conditional columns.
 * To add a column: one entry here + one entry in SORTS. Nothing else.
 * ════════════════════════════════════════════════════ */
var SCREEN_COLUMNS = [
  { key: 'name',   label: 'Name',
    cell: function (s) { return '<td><div class="tn">' + esc(s.name) + '</div><div class="ti">' + esc(s.id_isin) + (s.ticker ? ' &middot; ' + esc(s.ticker) : '') + '</div></td>'; } },
  { key: 'tier',   label: 'Tier',
    cell: function (s) {
      var covCls = s.coverage === 'full' ? 'cov-full' : s.coverage === 'quant' ? 'cov-quant' : 'cov-basic';
      return '<td><span class="tier ' + tierCls(s.tier) + '">' + esc(s.tier || '\u2014') + '</span><div style="margin-top:3px"><span class="coverage-badge ' + covCls + '">' + s.coverage + '</span></div></td>';
    } },
  { key: 'region', label: 'Region',
    cell: function (s) { return '<td><span class="tsm">' + esc(s.region) + '</span></td>'; } },
  { key: 'sector', label: 'Sector',
    cell: function (s) { return '<td><span class="tsm">' + esc(s.sector) + '</span></td>'; } },
  { key: 'qCombined', label: 'Quant Q', align: 'c', sub: 'sub-scores',
    cell: function (s) {
      var qDots = s.qCombined > 0 ?
        '<div class="dots-row">' + [s.qValue, s.qEarnings, s.qQuality, s.qProfitab, s.qGrowth, s.qValuation, s.qSentiment].map(sdot).join('') + '</div>' : '';
      return '<td style="text-align:center"><span class="qb ' + qCls(s.qCombined) + '">' + (s.qCombined ? 'Q' + s.qCombined : '\u2014') + '</span>' + qDots + '</td>';
    } },
  { key: 'mktCap', label: 'Mkt Cap', align: 'r', sub: 'USD',
    cell: function (s) { return '<td style="text-align:right;font-weight:700">' + fmtMktCap(s.mktCap) + '</td>'; } },
  { key: 'upside', label: 'Upside %', align: 'r',
    cell: function (s) { return '<td style="text-align:right"><span class="uv ' + uCls(s.upside) + '">' + (s.upside !== null ? pct(s.upside, 1) : '\u2014') + '</span></td>'; } },
  { key: 'fwdPE',  label: 'Fwd P/E', align: 'r',
    cell: function (s) { return '<td style="text-align:right;font-weight:700">' + (cN(s.fwdPE) ? parseFloat(s.fwdPE).toFixed(1) + 'x' : '\u2014') + '</td>'; } },
  { key: 'expGr',  label: 'Earn. Growth', align: 'r', sub: 'FY1-FY3 EPS',
    cell: function (s) {
      var egN = cN(s.expGr);
      return '<td style="text-align:right;font-weight:700;color:' + perfColor(egN) + '">' + signedPct(egN !== null ? egN * 100 : null) + '</td>';
    } },
  { key: 'divYield', label: 'Div. Yield', align: 'r', when: function () { return window._divOn; },
    cell: function (s) {
      var dyN = cN(s.divYield);
      return '<td style="text-align:right;font-weight:700;color:' + (dyN > 0 ? 'var(--green)' : 'var(--muted)') + '">' + (dyN !== null ? dyN.toFixed(1) + '%' : '\u2014') + '</td>';
    } },
  { key: 'perfRel6m', label: 'Perf 6M', align: 'r',
    cell: function (s) {
      var rel6N = cN(s.perfRel6m);
      return '<td style="text-align:right;font-weight:700;color:' + perfColor(rel6N) + '">' + signedPct(rel6N) + '</td>';
    } },
  { key: 'flags', label: 'Flags',
    cell: function (s) {
      return '<td>' + s.flags.map(function (f) { return '<span class="fg' + (f === 'Stop Loss' || f === 'Sell' ? ' fgr' : '') + '">' + esc(f) + '</span>'; }).join('') + '</td>';
    } },
];

/** Columns active for the current data state (resolves `when` gates). */
function activeColumns() {
  return SCREEN_COLUMNS.filter(function (c) { return !c.when || c.when(); });
}

/** One filter chip. `call` is the inline handler expression, `on` toggles the
 *  active class, `cls` optionally overrides/extends the class (tier & quartile
 *  chips carry their own colour classes). */
function chipHTML(call, on, label, cls, attrs) {
  return '<button class="' + (cls || ('chip' + (on ? ' on' : ''))) + '" onclick="' + call + '"' + (attrs || '') + '>' + label + '</button>';
}

function buildScreen() {
  // Adopt a freshly-set drill preset; otherwise keep the current base so
  // filter/sort clicks don't silently drop the drill subset.
  if (window._drillPreset) {
    window._screenBase = window._drillPreset;
    window._screenLabel = window._drillLabel || null;
    window._drillPreset = null;
    window._drillLabel = null;
  }
  if (!window._screenBase) window._screenBase = universe;
  var label = window._screenLabel || null;
  window._divOn = universe.some(function(s) { return s.nums.divYield !== null; });
 
  var regions = ['All'].concat(Array.from(new Set(universe.map(function(s) { return s.region; }).filter(Boolean))).sort());
  var sectors = ['All'].concat(Array.from(new Set(universe.map(function(s) { return s.sector; }).filter(Boolean))).sort());
 
  var regOpts = regions.map(function(r) { return '<option' + (r === filters.region ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('');
  var secOpts = sectors.map(function(s) { return '<option' + (s === filters.sector ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('');
 
  var tierChips = CONFIG.chips.tiers.map(function(t) {
    var on = filters.tiers.indexOf(t) > -1;
    return chipHTML("toggleTier('" + t + "')", on, t, 'chip chip-' + t.toLowerCase() + (on ? ' on' : ''));
  }).join('');
  var qChips = CONFIG.chips.quartiles.map(function(q) {
    var on = filters.quants.indexOf(q) > -1;
    return chipHTML('toggleQ(' + q + ')', on, 'Q' + q, 'chip ' + (on ? 'q' + q + 'on' : ''));
  }).join('');
  var rChips = CONFIG.chips.risks.map(function(r) {
    var lbl = r === 'All' ? 'All' : r.charAt(0).toUpperCase() + r.slice(1);
    return chipHTML("setRisk('" + r + "')", filters.risk === r, lbl);
  }).join('');
  var upChips = CONFIG.chips.upsideMin.map(function(u) {
    var lbl = u === 0 ? 'All' : '\u2265' + (u * 100).toFixed(0) + '%';
    return chipHTML('setUpMin(' + u + ')', filters.upMin === u, lbl);
  }).join('');
  var sizeChips = CONFIG.chips.sizes.map(function(v) {
    var lbl = v === 'All' ? 'All' : v;
    return chipHTML('setSize(this.dataset.v)', filters.size === v, lbl, null, ' data-v="' + v + '"');
  }).join('');
  var peChips = CONFIG.chips.peMax.map(function(v) {
    var lbl = v === 0 ? 'All' : '\u2264' + v + 'x';
    return chipHTML('setPeMax(' + v + ')', filters.peMax === v, lbl);
  }).join('');
  var divChips = CONFIG.chips.divMin.map(function(v) {
    var lbl = v === 0 ? 'All' : '\u2265' + v + '%';
    return chipHTML('setDivMin(' + v + ')', filters.divMin === v, lbl);
  }).join('');
  var crncys = ['All'].concat(Array.from(new Set(universe.map(function(s) { return s.crncy; }).filter(Boolean))).sort());
  var crncyOpts = crncys.map(function(c) { return '<option' + (c === filters.crncy ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('');
  var prcChips = CONFIG.chips.prcMax.map(function(v) {
    return chipHTML('setPrcMax(' + v + ')', filters.prcMax === v, v === 0 ? 'All' : '\u2264' + v);
  }).join('');
  var fcfChips = CONFIG.chips.fcfMin.map(function(v) {
    return chipHTML('setFcfMin(' + v + ')', filters.fcfMin === v, v === 0 ? 'All' : '\u2265' + v + '%');
  }).join('');
  var ndChips = CONFIG.chips.ndMax.map(function(v) {
    return chipHTML('setNdMax(' + v + ')', filters.ndMax === v, v === 0 ? 'All' : '\u2264' + v + 'x');
  }).join('');
  var heldChips = CONFIG.chips.held.map(function(v) {
    var lbl = v === 'All' ? 'All' : v === 'Y' ? 'Held' : 'Not held';
    return chipHTML("setHeld('" + v + "')", filters.held === v, lbl);
  }).join('');
  var moreActive = filters.crncy !== 'All' || filters.prcMax > 0 || filters.fcfMin > 0 || filters.ndMax > 0 || filters.held !== 'All';
 
  var data = _screenData();
 
  function arr(f) { if (sortState.field !== f) return '<span style="opacity:.3">&updownarrow;</span>'; return sortState.dir === 'asc' ? '&#8593;' : '&#8595;'; }
  function sh(f, lbl) { return '<button class="srt' + (sortState.field === f ? ' on' : '') + '" onclick="setSort(\'' + f + '\')">' + lbl + ' ' + arr(f) + '</button>'; }
 
  var presetBanner = label ?
    '<div class="preset-banner"><span>&#8592; Filtered from Helicopter View: <b>' + esc(label) + '</b></span>' +
    '<button onclick="clearPreset()">View all</button></div>' : '';
 
  document.getElementById('main').innerHTML = presetBanner +
    '<div class="fbar">' +
    '<input class="srch" placeholder="ISIN / Name / Ticker..." value="' + esc(filters.search) + '" oninput="setSearch(this.value)">' +
    '<div class="sep"></div>' +
    '<span class="fl">Region</span><select class="fs" onchange="setRegion(this.value)">' + regOpts + '</select>' +
    '<span class="fl">Sector</span><select class="fs" onchange="setSector(this.value)">' + secOpts + '</select>' +
    '<div class="sep"></div>' +
    '<span class="fl">Tier</span><div class="chips">' + tierChips + '</div>' +
    '<div class="sep"></div>' +
    '<span class="fl">Combined Q</span><div class="chips">' + qChips + '</div>' +
    '<div class="sep"></div>' +
    '<span class="fl">Upside</span><div class="chips">' + upChips + '</div>' +
    '<div class="sep"></div>' +
    '<span class="fl">Fwd P/E</span><div class="chips">' + peChips + '</div>' +
    (window._divOn ? '<div class="sep"></div><span class="fl">Dividend</span><div class="chips">' + divChips + '</div>' : '') +
    '<div class="sep"></div>' +
    '<span class="fl">Size</span><div class="chips">' + sizeChips + '</div>' +
    '<div class="sep"></div>' +
    '<span class="fl">Risk</span><div class="chips">' + rChips + '</div>' +
    '<div class="sep"></div>' +
    '<button class="more-btn' + (showMoreFilters || moreActive ? ' on' : '') + '" onclick="toggleMoreFilters()">More filters ' + (showMoreFilters ? '\u25B4' : '\u25BE') + (moreActive && !showMoreFilters ? ' \u25CF' : '') + '</button>' +
    '<button class="export-btn" onclick="exportScreen()" title="Export the current screen to Excel">&#8681; Excel</button>' +
    '<span class="rcnt" id="rcnt">' + data.length + ' / ' + universe.length + '</span>' +
    '</div>' +
    (showMoreFilters ?
    '<div class="fbar fbar-more">' +
    '<span class="fl">Currency</span><select class="fs" onchange="setCrncy(this.value)">' + crncyOpts + '</select>' +
    '<div class="sep"></div>' +
    '<span class="fl">PRC</span><div class="chips">' + prcChips + '</div>' +
    '<div class="sep"></div>' +
    '<span class="fl">FCF Yield</span><div class="chips">' + fcfChips + '</div>' +
    '<div class="sep"></div>' +
    '<span class="fl">Net Debt/EBITDA</span><div class="chips">' + ndChips + '</div>' +
    '<div class="sep"></div>' +
    '<span class="fl">Position</span><div class="chips">' + heldChips + '</div>' +
    '</div>' : '') +
    '<div class="twrap"><table class="ut">' +
    '<thead><tr>' +
    activeColumns().map(function (c) {
      var sub = c.sub ? '<div style="font-size:7px;color:var(--muted);font-weight:400">' + c.sub + '</div>' : '';
      return '<th' + (c.align ? ' class="' + c.align + '"' : '') + '>' + sh(c.key, c.label) + sub + '</th>';
    }).join('') +
    '</tr></thead><tbody id="ut-body">' + _screenRows(data) + '</tbody></table></div>';
}

/* ════════════════════════════════════════════════════
 * SORT REGISTRY — one entry per sortable column.
 * `num(s)` extracts a numeric key (its `nul` value is used when the field
 * is missing, so blanks always sink to the bottom for the default desc
 * direction of that column); `str(s)` sorts lexically.
 * Adding a column = adding one line here + one entry in the column list.
 * ════════════════════════════════════════════════════ */
var SORTS = {
  tier:      { num: function (s) { return TIER_ORDER[s.tier] || 9; } },
  name:      { str: function (s) { return s.name; } },
  region:    { str: function (s) { return String(s.region || ''); } },
  sector:    { str: function (s) { return String(s.sector || ''); } },
  mktCap:    { num: function (s) { var v = s.nums.mktCap;    return v != null ? v : -1; } },
  flags:     { num: function (s) { return s.flags ? s.flags.length : 0; } },
  upside:    { num: function (s) { return s.upside != null ? s.upside : -999; } },
  qCombined: { num: function (s) { return s.qCombined || 9; } },
  fwdPE:     { num: function (s) { return s.nums.fwdPE || 9999; } },
  ytdRet:    { num: function (s) { return s.nums.ytdRet || -999; } },
  perfRel6m: { num: function (s) { var v = s.nums.perfRel6m; return v != null ? v : -9999; } },
  evEbitda:  { num: function (s) { var v = s.nums.evEbitda;  return v != null ? v : 99999; } },
  expGr:     { num: function (s) { var v = s.nums.expGr;     return v != null ? v : -9999; } },
  qualAvg:   { num: function (s) { return s.qualAvg || 9999; } },
  divYield:  { num: function (s) { return s.nums.divYield || -999; } },
};

/** Stable, non-mutating sort of `data` by a SORTS entry. Unknown fields = no-op order. */
function sortBy(data, field, dirWord) {
  var spec = SORTS[field];
  var dir = dirWord === 'asc' ? 1 : -1;
  return data.slice().sort(function (a, b) {
    if (!spec) return 0;
    if (spec.str) return dir * spec.str(a).localeCompare(spec.str(b));
    return dir * (spec.num(a) - spec.num(b));
  });
}

// ── Filter + sort the current base into the visible dataset (also sets _sd) ──
/**
 * VIEW-MODEL — applies every active filter to the current base
 * (full universe or drill preset), then sorts via the SORTS registry.
 * Single funnel: both the full render and the partial row update go
 * through here, so the two can never disagree.
 */
function _screenData() {
  var data = window._screenBase || universe;
  if (filters.search) { var q = filters.search.toLowerCase(); data = data.filter(function(s) { return s.name.toLowerCase().indexOf(q) > -1 || s.id_isin.toLowerCase().indexOf(q) > -1 || (s.ticker || '').toLowerCase().indexOf(q) > -1; }); }
  if (filters.region !== 'All') data = data.filter(function(s) { return s.region === filters.region; });
  if (filters.sector !== 'All') data = data.filter(function(s) { return s.sector === filters.sector; });
  if (filters.tiers.length > 0) data = data.filter(function(s) { return filters.tiers.indexOf(s.tier) > -1; });
  if (filters.quants.length > 0) data = data.filter(function(s) { return filters.quants.indexOf(s.qCombined) > -1; });
  if (filters.risk !== 'All') data = data.filter(function(s) { return s.risk === filters.risk; });
  if (filters.upMin > 0) data = data.filter(function(s) { return s.upside !== null && s.upside >= filters.upMin; });
  if (filters.size !== 'All') data = data.filter(function(s) {
    var m = s.nums.mktCap; if (m === null) return false;
    return filters.size === 'Large' ? m >= CONFIG.size.largeMin : filters.size === 'Mid' ? (m >= CONFIG.size.midMin && m < CONFIG.size.largeMin) : m < CONFIG.size.midMin;
  });
  if (filters.peMax > 0) data = data.filter(function(s) { var p = s.nums.fwdPE; return p !== null && p > 0 && p <= filters.peMax; });
  if (filters.crncy !== 'All') data = data.filter(function(s) { return s.crncy === filters.crncy; });
  if (filters.prcMax > 0) data = data.filter(function(s) { return s.prc !== null && s.prc > 0 && s.prc <= filters.prcMax; });
  if (filters.fcfMin > 0) data = data.filter(function(s) { var v = s.nums.fcfYield; return v !== null && v >= filters.fcfMin; });
  if (filters.ndMax > 0) data = data.filter(function(s) { var v = s.nums.netDebtEb; return v !== null && v <= filters.ndMax; });
  if (filters.held !== 'All') data = data.filter(function(s) { return (s.invested === 'Y' ? 'Y' : 'N') === filters.held; });
  if (filters.divMin > 0) data = data.filter(function(s) { var d = s.nums.divYield; return d !== null && d >= filters.divMin; });
 
  data = sortBy(data, sortState.field, sortState.dir);
  window._sd = data;
  return data;
}

// ── Build just the <tbody> rows for the current dataset ──
function _screenRows(data) {
  var cols = activeColumns();
  if (!data.length) return '<tr><td colspan="' + cols.length + '"><div class="empty"><div class="eico">&#8709;</div><div class="emsg">No securities</div></div></td></tr>';
  return data.map(function (s, i) {
    return '<tr onclick="openStockModal(window._sd[' + i + '])">' +
      cols.map(function (c) { return c.cell(s); }).join('') +
      '</tr>';
  }).join('');
}

// ── Partial update: refresh rows + count only, preserving the search input ──
function updateScreenRows() {
  var data = _screenData();
  var body = document.getElementById('ut-body');
  if (body) body.innerHTML = _screenRows(data);
  var cnt = document.getElementById('rcnt');
  if (cnt) cnt.textContent = data.length + ' / ' + universe.length;
}
 
// ════════════════════════════════════════════════════
// MOMENTUM VIEW
// ════════════════════════════════════════════════════
 
// Momentum score composite (0-100, higher = better momentum)
// 4 signal groups, each normalized 0-25:
//   1. Absolute performance  (ret1m, ret3m, ret6m)        → 25pts
//   2. Relative performance  (perfRel1w, perfRel1m, perfRel3m) → 25pts
//   3. Quant signals         (qSentiment, qEarnings)       → 25pts
//   4. Technical             (tech/Bollinger signal)       → 25pts
 
/**
 * MODEL — composite momentum score, 0-100.
 * 4 equally-weighted legs (25 pts each): absolute perf, relative perf,
 * quant sentiment + earnings revisions, short-term technical.
 * Returns { total, abs, rel, quant, tech } for the Momentum view.
 */
function computeMomentum(s) {
  var scores = { abs: null, rel: null, quant: null, tech: null };
 
  // ── 1. Absolute performance (avg of available periods, normalized) ──
  var absVals = [cN(s.ret1m), cN(s.ret3m), cN(s.ret6m)].filter(function(v) { return v !== null; });
  if (absVals.length > 0) {
    var absAvg = absVals.reduce(function(a, b) { return a + b; }, 0) / absVals.length;
    // Map: -20% → 0, 0% → 12.5, +20% → 25 (capped)
    scores.abs = Math.max(0, Math.min(25, 12.5 + absAvg * 0.625));
  }
 
  // ── 2. Relative performance (avg of available periods) ──
  var relVals = [cN(s.perfRel1m), cN(s.perfRel3m)].filter(function(v) { return v !== null; });
  if (relVals.length > 0) {
    var relAvg = relVals.reduce(function(a, b) { return a + b; }, 0) / relVals.length;
    // Map: -15% → 0, 0% → 12.5, +15% → 25 (capped)
    scores.rel = Math.max(0, Math.min(25, 12.5 + relAvg * 0.833));
  }
 
  // ── 3. Quant signals: qSentiment + qEarnings (1=best, 4=worst → invert) ──
  var quantSigs = [s.qSentiment, s.qEarnings].filter(function(v) { return v > 0; });
  if (quantSigs.length > 0) {
    var quantAvg = quantSigs.reduce(function(a, b) { return a + b; }, 0) / quantSigs.length;
    // Q1 → 25, Q2 → 16.7, Q3 → 8.3, Q4 → 0
    scores.quant = Math.max(0, (5 - quantAvg) / 4 * 25);
  }
 
  // ── 4. Technical / Bollinger signal ──
  var tech = String(s.tech || '').toUpperCase();
  var stop = String(s.stopLoss || '').toUpperCase();
  if (tech || stop) {
    if (stop.indexOf('STOP') > -1) {
      scores.tech = 0; // stop loss triggered → worst
    } else if (tech.indexOf('OVERBOUGHT') > -1 || tech.indexOf('ABOVE') > -1 || tech.indexOf('BULL') > -1 || tech.indexOf('BUY') > -1) {
      scores.tech = 22;
    } else if (tech.indexOf('OVERSOLD') > -1 || tech.indexOf('BELOW') > -1 || tech.indexOf('BEAR') > -1 || tech.indexOf('SELL') > -1) {
      scores.tech = 5;
    } else if (tech.indexOf('NEUTRAL') > -1 || tech.indexOf('MID') > -1 || tech) {
      scores.tech = 12.5; // neutral signal
    }
  }
 
  // ── Composite: average of available signals, scaled to 0-100 ──
  var available = Object.keys(scores).filter(function(k) { return scores[k] !== null; });
  if (available.length === 0) return { total: null, scores: scores, available: 0 };
  var total = available.reduce(function(sum, k) { return sum + scores[k]; }, 0);
  // Scale to 0-100 based on max possible (25 per signal)
  var maxPossible = available.length * 25;
  var normalized = (total / maxPossible) * 100;
  return { total: Math.round(normalized), scores: scores, available: available.length };
}
 
function scoreGrade(v) {
  if (v === null) return { grade: '—', cls: 'score-d' };
  if (v >= 75) return { grade: 'S', cls: 'score-s' };
  if (v >= 60) return { grade: 'A', cls: 'score-a' };
  if (v >= 45) return { grade: 'B', cls: 'score-b' };
  if (v >= 30) return { grade: 'C', cls: 'score-c' };
  return { grade: 'D', cls: 'score-d' };
}
 
var momFilters = { tier: 'All', region: 'All', minScore: 0, minUpside: 0 };
 
function buildMomentum() {
  // Compute momentum for all stocks with enough data
  var scored = universe.map(function(s) {
    var m = computeMomentum(s);
    return { s: s, mom: m };
  }).filter(function(x) { return x.mom.total !== null && x.mom.available >= 2; });
 
  // Apply filters
  var data = scored;
  if (momFilters.tier !== 'All') data = data.filter(function(x) { return x.s.tier === momFilters.tier; });
  if (momFilters.region !== 'All') data = data.filter(function(x) { return x.s.region === momFilters.region; });
  if (momFilters.minScore > 0) data = data.filter(function(x) { return x.mom.total >= momFilters.minScore; });
  if (momFilters.minUpside > 0) data = data.filter(function(x) { return x.s.upside !== null && x.s.upside >= momFilters.minUpside / 100; });
 
  // Sort by composite score desc
  data = data.slice().sort(function(a, b) { return b.mom.total - a.mom.total; });
  window._momData = data;
 
  var total = data.length;
  var regions = ['All'].concat(Array.from(new Set(universe.map(function(s) { return s.region; }).filter(Boolean))).sort());
  var regOpts = regions.map(function(r) { return '<option' + (r === momFilters.region ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('');
 
  var tierChips = ['All', 'HC', 'Buy', 'Hold'].map(function(t) {
    var cls = t === 'HC' ? 'chip-hc' : t === 'Buy' ? 'chip-buy' : t === 'Hold' ? 'chip-hold' : '';
    var on = momFilters.tier === t;
    return '<button class="chip ' + cls + (on ? ' on' : '') + '" onclick="setMomTier(\'' + t + '\')">' + t + '</button>';
  }).join('');
 
  var minChips = [0, 30, 45, 60, 75].map(function(v) {
    var lbl = v === 0 ? 'All' : '≥' + v;
    return '<button class="chip' + (momFilters.minScore === v ? ' on' : '') + '" onclick="setMomMin(' + v + ')">' + lbl + '</button>';
  }).join('');
  var upsideChips = [0, 5, 10, 15, 20].map(function(v) {
    var lbl = v === 0 ? 'All' : '≥' + v + '%';
    return '<button class="chip' + (momFilters.minUpside === v ? ' on' : '') + '" onclick="setMomUpside(' + v + ')">' + lbl + '</button>';
  }).join('');
 
  // Top 3 highlights (best momentum in each tier)
  var topHC   = data.filter(function(x) { return x.s.tier === 'HC'; })[0];
  var topBuy  = data.filter(function(x) { return x.s.tier === 'Buy'; })[0];
  var topAll  = data[0];
 
  function hlCard(item, label, color) {
    if (!item) return '<div class="mom-highlight" style="border-top-color:' + color + ';opacity:.4"><div class="mom-hl-label">' + label + '</div><div class="mom-hl-name" style="color:var(--muted)">—</div><div class="mom-hl-meta">No securities</div></div>';
    var g = scoreGrade(item.mom.total);
    return '<div class="mom-highlight" style="border-top-color:' + color + '" onclick="openStockModal(window._momData[' + data.indexOf(item) + '].s)">' +
      '<div class="mom-hl-label">' + label + '</div>' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
        '<span class="score-ring ' + g.cls + '">' + item.mom.total + '</span>' +
        '<div><div class="mom-hl-name">' + esc(item.s.name) + '</div>' +
        '<div class="mom-hl-meta">' + esc(item.s.tier) + ' &middot; ' + esc(item.s.region) + ' &middot; ' + esc(item.s.sector) + '</div></div>' +
      '</div>' +
      buildMomSignals(item) +
      '</div>';
  }
 
  function buildMomSignals(item) {
    var s = item.s;
    var sigs = [];
    // [label, plain-percentage value] — rendered identically, so build in a loop
    [['Rel 1M', cN(s.perfRel1m)], ['Rel 3M', cN(s.perfRel3m)],
     ['Abs 1M', cN(s.ret1m)],     ['Abs 3M', cN(s.ret3m)]].forEach(function (sig) {
      var v = sig[1];
      if (v !== null) sigs.push('<span class="mom-sig ' + (v > 0 ? 'sig-pos' : v < 0 ? 'sig-neg' : 'sig-neu') + '">' + sig[0] + ' ' + signedPct(v) + '</span>');
    });
    if (s.qSentiment) sigs.push('<span class="mom-sig ' + (s.qSentiment <= 2 ? 'sig-pos' : 'sig-neg') + '">Sentiment Q' + s.qSentiment + '</span>');
    if (s.qEarnings)  sigs.push('<span class="mom-sig ' + (s.qEarnings <= 2 ? 'sig-pos' : 'sig-neg') + '">Earnings Rev Q' + s.qEarnings + '</span>');
    if (s.tech)       sigs.push('<span class="mom-sig sig-neu">' + esc(s.tech.slice(0, 20)) + '</span>');
    return '<div class="mom-signals">' + sigs.join('') + '</div>';
  }
 
  // Full ranked list
  var rows = data.map(function(item, idx) {
    var s = item.s;
    var g = scoreGrade(item.mom.total);
    var sc = item.mom.scores;
    var upN = s.upside !== null ? pct(s.upside, 1) : '—';
    var upCol = s.upside >= 0.15 ? 'var(--green)' : s.upside >= 0 ? 'var(--muted)' : 'var(--red)';
 
    function scVal(v, invert) {
      if (v === null) return '<span style="color:var(--muted)">—</span>';
      var pct25 = Math.round(v / 25 * 100);
      var col = pct25 >= 65 ? 'var(--green)' : pct25 >= 40 ? 'var(--accent-dark)' : 'var(--red)';
      return '<span style="color:' + col + ';font-weight:700">' + pct25 + '</span>';
    }
 
    return '<div class="mom-card" onclick="openStockModal(window._momData[' + idx + '].s)">' +
      '<div class="mom-rank">' + (idx + 1) + '</div>' +
      '<div class="mom-body">' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<span class="score-ring ' + g.cls + '">' + item.mom.total + '</span>' +
          '<div style="min-width:0">' +
            '<div class="mom-name">' + esc(s.name) + '</div>' +
            '<div class="mom-meta">' +
              '<span class="tier ' + tierCls(s.tier) + '" style="font-size:7px;padding:1px 5px">' + esc(s.tier || '—') + '</span>' +
              ' ' + esc(s.region) + ' &middot; ' + esc(s.sector) +
            '</div>' +
          '</div>' +
        '</div>' +
        buildMomSignals(item) +
      '</div>' +
      '<div class="mom-scores">' +
        '<div class="mom-score-col"><div class="mom-score-lbl">Abs</div><div class="mom-score-val">' + scVal(sc.abs) + '</div></div>' +
        '<div class="mom-score-col"><div class="mom-score-lbl">Rel</div><div class="mom-score-val">' + scVal(sc.rel) + '</div></div>' +
        '<div class="mom-score-col"><div class="mom-score-lbl">Quant</div><div class="mom-score-val">' + scVal(sc.quant) + '</div></div>' +
        '<div class="mom-score-col"><div class="mom-score-lbl">Tech</div><div class="mom-score-val">' + scVal(sc.tech) + '</div></div>' +
        '<div class="mom-score-col" style="border-left:1px solid var(--border);padding-left:8px"><div class="mom-score-lbl">Upside</div><div class="mom-score-val" style="color:' + upCol + '">' + upN + '</div></div>' +
      '</div>' +
    '</div>';
  }).join('');
 
  document.getElementById('main').innerHTML =
    '<div class="mom-wrap">' +
    // Header
    '<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:4px">' +
      '<div style="font-size:22px;font-weight:700;letter-spacing:-.01em">Price Momentum</div>' +
      '<div style="font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase">Composite score 0–100 &mdash; ' + total + ' securities analysed</div>' +
    '</div>' +
    '<div style="font-size:9px;color:var(--muted);margin-bottom:18px">Score = Absolute Perf. (25%) + Relative Perf. (25%) + Quant Sentiment & Earnings Rev. (25%) + Technical Signal (25%)</div>' +
 
    // Controls
    '<div class="mom-controls">' +
      '<span class="fl">Tier</span><div class="chips">' + tierChips + '</div>' +
      '<div class="sep"></div>' +
      '<span class="fl">Region</span><select class="fs" onchange="setMomRegion(this.value)">' + regOpts + '</select>' +
      '<div class="sep"></div>' +
      '<span class="fl">Min score</span><div class="chips">' + minChips + '</div>' +
      '<div class="sep"></div>' +
      '<span class="fl">Min upside</span><div class="chips">' + upsideChips + '</div>' +
      '<span class="rcnt" style="margin-left:auto">' + total + ' securities</span>' +
    '</div>' +
 
    // Score legend
    '<div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap">' +
      [['S','≥75 — Strong momentum','score-s'],['A','60–74 — Good','score-a'],['B','45–59 — Neutral+','score-b'],['C','30–44 — Weak','score-c'],['D','<30 — Negative','score-d']].map(function(g) {
        return '<div style="display:flex;align-items:center;gap:5px"><span class="score-ring ' + g[2] + '" style="width:22px;height:22px;font-size:9px">' + g[0] + '</span><span style="font-size:9px;color:var(--muted)">' + g[1] + '</span></div>';
      }).join('') +
    '</div>' +
 
    // Top 3 highlights
    '<div class="mom-section-title">Top Opportunities</div>' +
    '<div class="mom-top-grid">' +
      hlCard(topAll,  'Best Overall Score',        'var(--accent)') +
      hlCard(topHC,   'Best HC',                    'var(--tier-hc)') +
      hlCard(topBuy,  'Best Buy',                   'var(--tier-buy)') +
    '</div>' +
 
    // Full ranking
    '<div class="mom-section-title">Full Ranking &mdash; ' + total + ' securities</div>' +
    (total === 0
      ? '<div class="empty"><div class="eico">&#8709;</div><div class="emsg">Not enough momentum data &mdash; quant fields required</div></div>'
      : '<div class="mom-grid">' + rows + '</div>') +
    '</div>';
}
 
function setMomTier(v)    { momFilters.tier = v;        buildMomentum(); }
function setMomRegion(v)  { momFilters.region = v;      buildMomentum(); }

function setSector(v) { filters.sector = v; buildScreen(); }

function setCrncy(v) { filters.crncy = v; buildScreen(); }
function setPrcMax(v) { filters.prcMax = parseFloat(v) || 0; buildScreen(); }

function setNdMax(v) { filters.ndMax = parseFloat(v) || 0; buildScreen(); }

/** Human-readable summary of active filters — used on the Excel info sheet. */
function activeFilterSummary() {
  var out = [];
  if (filters.search) out.push('Search: "' + filters.search + '"');
  if (filters.region !== 'All') out.push('Region: ' + filters.region);
  if (filters.sector !== 'All') out.push('Sector: ' + filters.sector);
  if (filters.tiers.length) out.push('Tier: ' + filters.tiers.join('/'));
  if (filters.quants.length) out.push('Combined Q: ' + filters.quants.map(function(q){return 'Q'+q;}).join('/'));
  if (filters.upMin > 0) out.push('Upside \u2265 ' + (filters.upMin*100) + '%');
  if (filters.peMax > 0) out.push('Fwd P/E \u2264 ' + filters.peMax + 'x');
  if (filters.divMin > 0) out.push('Dividend yield \u2265 ' + filters.divMin + '%');
  if (filters.size !== 'All') out.push('Size: ' + filters.size);
  if (filters.risk !== 'All') out.push('Risk: ' + filters.risk);
  if (filters.crncy !== 'All') out.push('Currency: ' + filters.crncy);
  if (filters.prcMax > 0) out.push('PRC \u2264 ' + filters.prcMax);
  if (filters.fcfMin > 0) out.push('FCF yield \u2265 ' + filters.fcfMin + '%');
  if (filters.ndMax > 0) out.push('Net Debt/EBITDA \u2264 ' + filters.ndMax + 'x');
  if (filters.held !== 'All') out.push(filters.held === 'Y' ? 'Held positions only' : 'Non-held only');
  if (window._screenLabel) out.push('Drill subset: ' + window._screenLabel);
  return out.length ? out : ['None (full universe)'];
}

/**

  var prompt =

    'Price ' + (s.lastPx||'?') + ' | Target ' + (s.target||'?') + ' | Upside ' + (s.upside !== null ? (s.upside*100).toFixed(1)+'%' : '?') +

    'Format: 3 bullets (• Investment case  • Valuation & signals  • Key risk). Max 80 words total. No intro, no conclusion.';
 
  // Timeout via flag (AbortController causes postMessage issues in some browsers)

    timedOut = true;
    result.innerHTML = '<div style="margin-top:10px;padding:10px 12px;background:#f8d7da;color:#842029;font-size:10px">&#9888; Timeout — please retry.</div>';
    btn.innerHTML = '&#10024; Retry';
    btn.disabled = false;
  }, 20000);
 
  var apiKey = loadApiKey();
  if (!apiKey) {
    result.innerHTML =
      '<div style="margin-top:10px;padding:10px 12px;background:#fef3cd;color:#856404;font-size:10px;line-height:1.5">' +
      '&#9888; No API key configured. Go to <b>&#128190; Data Files</b> and enter your Anthropic API key.</div>';
    btn.innerHTML = '&#10024; Generate AI Summary';
    btn.disabled = false;
    clearTimeout(timer);
    return;
  }
 
  // Direct browser -> Anthropic call. The dangerous-direct-browser-access
  // header is required for CORS; the trade-off (key lives client-side) is
  // documented next to the key input in the Data Files view.
  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,

      model: 'claude-haiku-4-5-20251001',

  })
  .then(function(r) {
    clearTimeout(timer);
    if (timedOut) return;
    if (r.status === 401 || r.status === 403) throw new Error('auth_' + r.status);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function(data) {
    if (!data || timedOut) return;
    if (data.error) throw new Error(data.error.message || 'API error');
    var text = data.content && data.content[0] ? data.content[0].text : 'No response.';
    // Escape first (proxy responses are untrusted input), then apply light formatting

    result.innerHTML =
      '<div style="margin-top:10px;padding:12px 14px;background:var(--cream);border-left:3px solid var(--accent);font-size:11px;line-height:1.7;color:var(--ink)">' +

      '</div>';
    btn.innerHTML = '&#10227; Refresh';
    btn.disabled = false;
  })
  .catch(function(err) {
    clearTimeout(timer);
    if (timedOut) return;
    var msg;
    if (err.message && err.message.indexOf('auth_') === 0) {
      msg = 'Invalid API key — please check your key in Data Files.';
    } else if (err.message && err.message.indexOf('Failed to fetch') > -1) {
      msg = 'Network error — could not reach api.anthropic.com (check connectivity / corporate proxy).';
    } else {
      msg = err.message || 'Unknown error';
    }
    result.innerHTML =
      '<div style="margin-top:10px;padding:10px 12px;background:#f8d7da;color:#842029;font-size:10px;line-height:1.5">' +
      '&#9888; ' + esc(msg) + '</div>';
    btn.innerHTML = '&#10024; Retry';
    btn.disabled = false;
  });
}

      if (!Array.isArray(data) || data.length < 10) return false;
      raw.main = data;
      console.log('[screener] Loaded', data.length, 'securities from portal data layer');
      runFusion();
      return true;
    })
    .catch(function(e) {
      console.log('[screener] Portal data not available:', e.message, '— falling back to upload');
      return false;
    });
}

// ── INIT — cache → portal data → manual upload ──────────────
function init() {
  // 1. Try localStorage cache (instant)
  var hadCache = loadAllRaw();
  if (hadCache && raw.main && raw.main.length) {
    runFusion();
    return;
  }
  // 2. Try shared portal data layer (async fetch)
  tryLoadFromPortal().then(function(loaded) {
    if (!loaded) {
      // 3. Fall back to manual file upload
      renderUpload();
    }
  });
}
