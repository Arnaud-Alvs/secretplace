<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirabaud | Equity Screener</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── Mirabaud Brand Colors ── */
  --ink:#002A4A;           /* Mirabaud Navy — primary text, headers */
  --paper:#F7F9FB;         /* Near-white page background */
  --cream:#EFF2F7;         /* Light blue-grey for alternating rows / panels */
  --accent:#BC9654;        /* Mirabaud Gold — accents, borders, highlights */
  --accent-dark:#9a7a28;   /* Darker gold for hover states */
  --muted:#898989;         /* Mid-grey for secondary labels */
  --red:#c0392b;           /* Keep red for negative / risk indicators */
  --green:#1e7e4a;         /* Keep green for positive indicators */
  --blue:#397AA9;          /* Mirabaud Blue — secondary headers, links */
  --border:#AFBED6;        /* Light blue-grey borders */
  --white:#FFFFFF;
  --corporate-blue:#005183; /* Corporate Blue — chart labels, table headers */
  /* ── Tier Colors (Mirabaud equity product palette) ── */
  --tier-hc:#005183;       /* HC → Corporate Blue */
  --tier-buy:#007A64;      /* Buy → Teal Green */
  --tier-hold:#397AA9;     /* Hold → Mirabaud Blue */
  --tier-watch:#898989;    /* Watch → Grey */
}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:13px}
#app{display:flex;flex-direction:column;height:100vh}
.main{flex:1;overflow-y:auto;position:relative}
 
/* ── HEADER ── */
.header{background:#002A4A;color:#FFFFFF;padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:3px solid var(--accent)}
.brand{font-size:15px;font-weight:700;letter-spacing:.08em;font-family:Arial,sans-serif}
.brand span{font-size:9px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-left:12px;opacity:.9}
.nav{display:flex;gap:24px;align-items:center}
.nav button{font-family:Arial,sans-serif;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;background:none;border:none;color:#AFBED6;cursor:pointer;padding:4px 0;border-bottom:2px solid transparent;transition:all .15s}
.nav button.active,.nav button:hover{color:var(--accent);border-bottom-color:var(--accent)}
 
/* ── UPLOAD ── */
.upload-wrap{max-width:860px;margin:48px auto;padding:0 24px}
.upload-title{font-size:28px;font-weight:700;margin-bottom:6px;letter-spacing:-.02em}
.upload-sub{font-size:9px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
.upload-legend{display:flex;gap:16px;margin-bottom:32px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.legend-dot{width:8px;height:8px;border-radius:50%}
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
.ucard{border:1px solid var(--border);padding:20px;background:var(--white);transition:border-color .2s;position:relative}
.ucard.loaded{border-color:var(--accent);background:#fdf9ef}
.ucard.required::after{content:'REQUIS';position:absolute;top:12px;right:12px;font-size:7px;font-weight:700;letter-spacing:.15em;color:var(--muted)}
.ucard.loaded::after{content:'✓ OK';color:var(--green)}
.ctag{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.ctitle{font-size:14px;font-weight:700;margin-bottom:3px}
.crole{font-size:10px;color:var(--accent-dark);font-weight:700;margin-bottom:6px}
.cdesc{font-size:10px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.cstatus{font-size:9px;font-weight:700;margin-bottom:10px}
.ok{color:var(--green)}.pend{color:var(--muted)}
.flabel{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;border:1px solid var(--ink);padding:6px 12px;cursor:pointer;transition:all .15s;font-family:Arial,sans-serif}
.flabel:hover{background:var(--ink);color:var(--white)}
input[type=file]{display:none}
.upload-actions{display:flex;align-items:center;gap:16px}
.run-btn{font-family:Arial,sans-serif;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;background:#005183;color:var(--white);border:none;padding:13px 28px;cursor:pointer;transition:background .15s}
.run-btn:hover{background:var(--ink)}
.run-btn:disabled{opacity:.3;cursor:not-allowed}
.upload-note{font-size:9px;color:var(--muted);line-height:1.7;margin-top:16px}
 
/* ── VALIDATION REPORT ── */
.val-report{background:var(--white);border:1px solid var(--border);padding:16px 20px;margin-top:16px;display:none}
.val-report.show{display:block}
.val-title{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
.val-row{display:flex;justify-content:space-between;font-size:10px;padding:4px 0;border-bottom:1px solid var(--cream)}
.val-row:last-child{border-bottom:none}
.val-key{color:var(--muted);font-weight:700}
.val-ok{color:var(--green);font-weight:700}
.val-warn{color:var(--accent-dark);font-weight:700}
.val-err{color:var(--red);font-weight:700}
 
/* ── TIER BADGES ── */
.tier{display:inline-block;font-size:8px;font-weight:700;padding:2px 7px;border-radius:2px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tier-hc{background:#D4E4F0;color:#005183}
.tier-buy{background:#D4E4F0;color:#007A64}
.tier-hold{background:#EFF2F7;color:#397AA9}
.tier-watch{background:var(--cream);color:var(--muted)}
.tier-none{background:var(--cream);color:var(--muted)}
 
/* ── MACRO ── */
.macro-wrap{padding:20px 28px;transition:margin-right .25s}
.macro-wrap.shifted{margin-right:430px}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--white);border:1px solid var(--border);padding:14px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative}
.kpi:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(200,168,75,.15)}
.kpi.active{border-color:var(--accent);border-bottom:3px solid var(--accent)}
.kpi-lbl{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.kpi-val{font-size:22px;font-weight:700;line-height:1}
.kpi-sub{font-size:9px;color:var(--muted);margin-top:3px}
.kpi-hint{position:absolute;top:8px;right:8px;font-size:9px;color:var(--border)}
.kpi:hover .kpi-hint{color:var(--accent)}
.kvg{color:var(--green)}.kvr{color:var(--red)}.kvo{color:var(--accent-dark)}.kvb{color:var(--blue)}.kvp{color:var(--tier-hc)}
.tier-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.tier-kpi{background:var(--white);border:1px solid var(--border);padding:12px 16px;cursor:pointer;transition:all .15s;border-left:4px solid transparent}
.tier-kpi:hover,.tier-kpi.active{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tier-kpi.t-hc{border-left-color:var(--tier-hc)}.tier-kpi.t-hc:hover,.tier-kpi.t-hc.active{background:#faf8ff}
.tier-kpi.t-buy{border-left-color:var(--tier-buy)}.tier-kpi.t-buy:hover,.tier-kpi.t-buy.active{background:#f0faf4}
.tier-kpi.t-hold{border-left-color:var(--tier-hold)}.tier-kpi.t-hold:hover,.tier-kpi.t-hold.active{background:#f0f7fd}
.tier-kpi.t-watch{border-left-color:var(--red)}.tier-kpi.t-watch:hover,.tier-kpi.t-watch.active{background:#fdf3f4}
.tier-kpi.t-watch .tier-kpi-lbl{color:var(--red)}
.tier-kpi-lbl{font-size:8px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tier-kpi-val{font-size:20px;font-weight:700}
.tier-kpi-sub{font-size:9px;color:var(--muted);margin-top:2px}
 
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.panel{background:var(--white);border:1px solid var(--border)}
.ph{padding:10px 16px;border-bottom:2px solid var(--border);background:#002A4A;display:flex;justify-content:space-between;align-items:center}
.pht{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#FFFFFF}
.phh{font-size:8px;color:var(--accent)}
.pb{padding:12px 16px}
.brow{display:flex;align-items:center;gap:8px;margin-bottom:7px;cursor:pointer;padding:3px 4px;border-radius:2px;transition:background .1s}
.brow:last-child{margin-bottom:0}
.brow:hover,.brow.active{background:var(--cream)}
.brow.active{outline:1px solid var(--accent)}
.bname{font-size:10px;font-weight:700;width:130px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{flex:1;height:5px;background:var(--cream);overflow:hidden}
.bfill{height:100%;transition:width .4s}
.bf0{background:var(--ink)}.bf1{background:var(--green)}.bf2{background:var(--red)}.bf3{background:var(--accent)}.bf4{background:var(--blue)}.bf5{background:var(--tier-hc)}
.bmeta{font-size:9px;color:var(--muted);width:40px;text-align:right;flex-shrink:0}
.bmeta2{font-size:9px;font-weight:700;width:60px;text-align:right;flex-shrink:0}
.rrow{display:flex;justify-content:space-between;align-items:center;padding:7px 6px;border-bottom:1px solid var(--cream);cursor:pointer;transition:background .1s;border-radius:2px}
.rrow:last-child{border-bottom:none}
.rrow:hover,.rrow.active{background:var(--cream)}
.rrow.active{outline:1px solid var(--accent)}
.rname{font-size:11px;font-weight:700}
.rdet{font-size:9px;color:var(--muted)}
.rup{font-size:11px;font-weight:700}
.rpos{color:var(--green)}.rneg{color:var(--red)}
.qscores{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.qscore-item{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:var(--cream);border-radius:2px}
.qscore-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.qscore-val{font-size:10px;font-weight:700}
 
/* ── SCORE DOTS ── */
.sdot{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle}
.sdot1{background:#007A64}.sdot2{background:#397AA9}.sdot3{background:#BC9654}.sdot4{background:#c0392b}.sdot0{background:var(--border)}
.dots-row{display:flex;gap:2px;margin-top:3px}
 
/* ── DRILL PANEL ── */
.drill-panel{position:fixed;top:56px;right:0;bottom:0;width:420px;background:var(--white);border-left:3px solid var(--accent);display:flex;flex-direction:column;z-index:50;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.drill-panel.open{transform:translateX(0)}
.dp-header{background:#002A4A;color:#FFFFFF;padding:14px 16px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between}
.dp-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.dp-subtitle{font-size:9px;color:var(--accent);margin-top:3px}
.dp-close{font-family:Arial,sans-serif;font-size:9px;font-weight:700;background:none;border:none;color:#AFBED6;cursor:pointer;transition:color .15s;padding:0 0 0 12px;flex-shrink:0}
.dp-close:hover{color:var(--accent)}
.dp-actions{padding:9px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0;background:var(--cream)}
.dp-action-btn{font-family:Arial,sans-serif;font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:#005183;color:#FFFFFF;border:none;padding:5px 10px;cursor:pointer}
.dp-action-btn:hover{background:#002A4A}
.dp-count{font-size:9px;color:var(--muted);margin-left:auto}
.dp-body{flex:1;overflow-y:auto}
.dp-table{width:100%;border-collapse:collapse}
.dp-table th{font-size:7px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#FFFFFF;padding:6px 8px;border-bottom:2px solid #002A4A;position:sticky;top:0;background:#005183;white-space:nowrap;text-align:left}
.dp-table th.r{text-align:right}
.dp-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.dp-table tbody tr{cursor:pointer;transition:background .1s}
.dp-table tbody tr:hover{background:#EFF2F7}
.dp-name{font-size:10px;font-weight:700}
.dp-isin{font-size:8px;color:var(--muted);margin-top:1px}
 
/* ── FILTER BAR ── */
.fbar{background:var(--white);border-bottom:2px solid var(--border);padding:9px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-shrink:0}
.fl{font-size:8px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
select.fs{font-family:Arial,sans-serif;font-size:10px;font-weight:700;background:var(--cream);border:1px solid var(--border);padding:4px 7px;cursor:pointer;outline:none;color:var(--ink)}
select.fs:focus{border-color:var(--corporate-blue)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-family:Arial,sans-serif;font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--border);cursor:pointer;background:var(--white);transition:all .12s;border-radius:20px;color:var(--ink)}
.chip:hover{border-color:var(--corporate-blue);color:var(--corporate-blue)}
.chip.on{background:#005183;color:#FFFFFF;border-color:#005183}
.chip-hc.on{background:#005183;border-color:#002A4A;color:#fff}
.chip-buy.on{background:#007A64;border-color:#007A64;color:#fff}
.chip-hold.on{background:#397AA9;border-color:#397AA9;color:#fff}
.q1on{background:#007A64!important;border-color:#007A64!important;color:#fff!important}
.q2on{background:#397AA9!important;border-color:#397AA9!important;color:#fff!important}
.q3on{background:#BC9654!important;border-color:#BC9654!important;color:#fff!important}
.q4on{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
.sep{width:1px;height:18px;background:var(--border);flex-shrink:0}
input.srch{font-family:Arial,sans-serif;font-size:10px;background:var(--cream);border:1px solid var(--border);padding:4px 10px;outline:none;width:170px;color:var(--ink)}
input.srch:focus{border-color:var(--corporate-blue)}
.rcnt{font-size:9px;color:var(--muted);margin-left:auto;white-space:nowrap}
 
/* ── UNIVERSE TABLE ── */
.twrap{padding:0 28px 32px}
table.ut{width:100%;border-collapse:collapse;margin-top:12px;font-size:11px;font-family:Arial,sans-serif}
table.ut thead tr{border-bottom:2px solid #002A4A;background:#005183}
table.ut th{font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#FFFFFF;padding:8px 8px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:6;background:#005183;box-shadow:inset 0 -2px 0 var(--accent)}
table.ut th.r{text-align:right}table.ut th.c{text-align:center}
table.ut tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
table.ut tbody tr:hover{background:#D4E4F0}
table.ut tbody tr:nth-child(even){background:#EFF2F7}
table.ut tbody tr:nth-child(even):hover{background:#D4E4F0}
table.ut td{padding:8px 8px;vertical-align:middle}
.tn{font-size:11px;font-weight:700}
.ti{font-size:9px;color:var(--muted);margin-top:1px}
.tsm{font-size:9px;color:var(--muted)}
.qb{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:2px;white-space:nowrap}
.q1{background:#D4E4F0;color:#005183}.q2{background:#EFF2F7;color:#397AA9}
.q3{background:#F7EDD8;color:#9a7a28}.q4{background:#f8d7da;color:#842029}.q0{background:var(--cream);color:var(--muted)}
.uv{font-size:11px;font-weight:700}
.uhi{color:var(--green)}.umed{color:var(--accent-dark)}.ulo{color:var(--muted)}.uneg{color:var(--red)}
.rb{font-size:8px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:2px}
.rhi{background:#f8d7da;color:#842029}.rme{background:#fef3cd;color:#856404}.rlo{background:#d4edda;color:#1e7e4a}
.fg{display:inline-block;font-size:7px;font-weight:700;padding:2px 4px;background:#f0ebff;color:#6d28d9;margin-right:2px;border-radius:2px;white-space:nowrap}
.fgr{background:#f8d7da;color:#842029}
th button.srt{font-family:inherit;font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:none;border:none;color:var(--muted);cursor:pointer;white-space:nowrap}
th button.srt.on{color:var(--ink)}
.coverage-badge{font-size:7px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:2px;background:var(--cream);color:var(--muted)}
.cov-full{background:#ede9ff;color:var(--tier-hc)}
.cov-quant{background:#d0e8f5;color:var(--tier-hold)}
.cov-basic{background:var(--cream);color:var(--muted)}
 
/* ── STOCK MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,42,74,.6);z-index:200;display:flex;justify-content:flex-end}
.modal{width:600px;height:100%;background:var(--paper);overflow-y:auto;border-left:3px solid var(--accent)}
.mhdr{background:#002A4A;color:#FFFFFF;padding:20px 24px;position:sticky;top:0;z-index:1;border-bottom:3px solid var(--accent)}
.mclose{font-family:Arial,sans-serif;font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;background:none;border:none;color:#AFBED6;cursor:pointer;margin-bottom:12px;display:block;transition:color .15s}
.mclose:hover{color:var(--accent)}
.mtag{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.mname{font-size:22px;font-weight:700;line-height:1.15;margin-bottom:3px}
.misin{font-size:9px;color:#AFBED6;letter-spacing:.1em}
.mbody{padding:20px 24px}
.msec{margin-bottom:20px}
.mst{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;padding-bottom:5px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.mmetrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.mmet{background:var(--white);border:1px solid var(--border);padding:10px 12px}
.mml{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.mmv{font-size:16px;font-weight:700}
.mmg{color:var(--green)}.mmr{color:var(--red)}.mmo{color:var(--accent-dark)}.mmb{color:var(--blue)}
.qr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--cream)}
.qr:last-child{border-bottom:none}
.qk{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.qv{font-size:10px;font-weight:700}
.quant-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.qg-item{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:var(--white);border:1px solid var(--border)}
.qg-lbl{font-size:8px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.qual-score-row{display:flex;align-items:center;padding:5px 0;border-bottom:1px solid var(--cream)}
.qual-score-row:last-child{border-bottom:none}
.qual-score-lbl{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;flex:1}
.qual-score-dots{display:flex;gap:3px;align-items:center}
.qual-dot{width:14px;height:14px;border-radius:2px;border:1px solid var(--border)}
.qdot-filled-1{background:#007A64;border-color:#007A64}.qdot-filled-2{background:#397AA9;border-color:#397AA9}
.qdot-filled-3{background:#BC9654;border-color:#BC9654}.qdot-filled-4{background:#c0392b;border-color:#c0392b}
.qual-score-num{font-size:9px;font-weight:700;margin-left:8px;width:14px;text-align:center}
.perf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.perf-item{background:var(--white);border:1px solid var(--border);padding:8px 10px;text-align:center}
.perf-lbl{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
.perf-val{font-size:14px;font-weight:700}
.fglg{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;background:#f8d7da;color:#842029;margin-right:4px;margin-bottom:4px;border-radius:2px}
.fglg.w{background:#fef3cd;color:#856404}
.no-data{font-size:9px;color:var(--muted);font-style:italic;padding:8px 0}

<!-- DRILL PANEL -->
<div class="drill-panel" id="drill-panel">
  <div class="dp-header">
    <div><div class="dp-title" id="dp-title">—</div><div class="dp-subtitle" id="dp-subtitle"></div></div>
    <button class="dp-close" aria-label="Close panel" onclick="closeDrill()">&#10005;</button>

    <button class="dp-action-btn" onclick="drillToScreen()">&#8594; Open in Screen</button>
    <span class="dp-count" id="dp-count"></span>
  </div>
  <div class="dp-body" id="dp-body"></div>
</div>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/**
 * ════════════════════════════════════════════════════════════════════
 *  MIRABAUD EQUITY SCREENER — single-file application
 * ════════════════════════════════════════════════════════════════════
 *  Architecture (top to bottom):
 *    CONFIG   — every tunable constant and magic number, in one place
 *    STATE    — application state (raw data, derived universe, UI filters)
 *    Fmt      — pure formatting/parsing helpers (no DOM, no state)
 *    Storage  — localStorage persistence layer
 *    Parse    — CSV/XLSX -> row objects (shared header pipeline)
 *    Model    — fusion (rows -> securities), risk & momentum derivations
 *    Views    — render functions, one per screen + shared components
 *    Actions  — event handlers wired from inline on* attributes
 *    PUBLIC API — the single explicit export table at the bottom of this
 *                 file; ONLY those names are reachable from the HTML.
 *
 *  Data flow:
 *    file -> Parse.buildRows -> raw.main -> Model.fuse() -> universe[]
 *         -> Views render from universe + filters -> user events
 *         -> Actions mutate filters/state -> targeted re-render.
 *
 *  Invariants:
 *    - universe[] is derived state: never mutated by views, only rebuilt
 *      by the fusion step from raw.main.
 *    - Cross-view handoff (drill -> screen, row -> modal) goes through
 *      the window._* channels listed at the export section.
 * ════════════════════════════════════════════════════════════════════
 */
(function () {
'use strict';

/* ════════════════════════════════════════════════════
 * CONFIG — every tunable constant in one place.
 * Change behaviour here, not in the code below.
 * ════════════════════════════════════════════════════ */
var CONFIG = {
  /** Risk-flag thresholds (see the ⓘ tooltip on the High Risk KPI). */
  risk: {
    lowUpsideBelow: 0.08,   // analyst upside below 8% -> 'Low Upside'
    stretchedPEAbove: 35,   // forward P/E above 35x   -> 'Stretched P/E'
    crowdingPutCallAbove: 2,// put/call > 2 AND ...
    crowdingShortIntBelow: 2,// ... short interest < 2 -> 'Crowding Risk'
    highAtFlags: 2,         // 2+ flags = high, 1 = medium, 0 = low
  },
  /** Market-cap size buckets, USD bn. */
  size: { largeMin: 10, midMin: 2 },
  /** Filter-chip value sets (0 / 'All' = no filter). */
  chips: {
    upsideMin: [0, 0.10, 0.15, 0.20],
    peMax:     [0, 10, 15, 20],
    divMin:    [0, 2, 3, 4],
    quartiles: [1, 2, 3, 4],
    prcMax:    [0, 2, 3, 4],      // PRC suitability ceiling (0 = All)
    fcfMin:    [0, 3, 5, 8],      // FCF yield floor, %
    ndMax:     [0, 1, 2, 3],      // Net Debt/EBITDA ceiling, x
    held:      ['All', 'Y', 'N'], // bank position flag (Invested Y/N)
    sizes:     ['All', 'Large', 'Mid', 'Small'],
    tiers:     ['HC', 'Buy', 'Hold'],
    risks:     ['All', 'low', 'medium', 'high'],
  },
};

// ════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════
var raw = { main: null }; // single BBG_RAW file
var universe = []; // merged records
var sortState = { field: 'upside', dir: 'desc' };
var showMoreFilters = false; // 'More filters' row visibility (session-scoped)
var filters = { search: '', region: 'All', sector: 'All', tiers: [], quants: [], risk: 'All', divMin: 0, upMin: 0, size: 'All', peMax: 0, crncy: 'All', prcMax: 0, fcfMin: 0, ndMax: 0, held: 'All' };
 
// ── PERSISTENCE ──────────────────────────────────────
var STORAGE_KEYS = { main: 'mhc_raw_main' };
var STORAGE_META = 'mhc_raw_meta';
var STORAGE_API_KEY = 'mhc_api_key'; // Anthropic API key, stored ONLY in this browser's localStorage
 
function saveApiKey(key) {
  try { localStorage.setItem(STORAGE_API_KEY, key); return true; } catch(e) { return false; }
}
function loadApiKey() {
  try { return localStorage.getItem(STORAGE_API_KEY) || ''; } catch(e) { return ''; }
}
function clearApiKey() {
  try { localStorage.removeItem(STORAGE_API_KEY); } catch(e) {}
}
 
// Columns we actually use — prune everything else before saving
var COLS_KEEP = {
  main: ['isin','ticker','company name','gics sector','sub-industry','country','currency',
         'mkt cap (usd bn)','indicated dividend yield','indicated dividend yild',
         '1w change %','1m change %','3m change %','6m change %','12m change %','ytd change %',
         '1m price performance','3m price performance','6m price performance',
         'invested (y/n)','put/call volume ratio','short interest ratio','net revision breadth',
         'analyst upside %','price','analyst target price','hc target price','cfra price target',
         'cfra rating','core / satellite','esg leader','prc',
         'best pe','best p/book','best ev/ebitda','price/sales','fcf yield','net debt / ebitda',
         'roe lf','roa lf','operating margin','profit margin',
         'relative vs world 1m performance','relative world 3m performance',
         'relative world 6m performance','relative performance 12m exl. last month',
         'distance to 52w high','bollinger %b (30d)','bollinger %b',
         'eps rev 3m','eps rev 4w','revenue rev 3m','ebit rev 3m',
         'combined quartile','combined score','quality q','prof. q','growth q',
         'valuation q','bs&cf q','sentiment q','earnings rev q','vl value creation q','momentum q',
         'fy1-fy3 eps cagr','fy1-fy3 sales cagr','eps growth 1y','sales growth 1y',
         'ebit / interest','future nd/ebitda (1fy)',
         'cfra investmenet universe']
};
 
function pruneRow(row, keys) {
  var out = {};
  keys.forEach(function(k) { if (row[k] !== undefined) out[k] = row[k]; });
  return out;
}
function pruneData(key, data) {
  var keep = COLS_KEEP['main'];
  if (!keep) return data;
  return data.map(function(row) { return pruneRow(row, keep); });
}
 
function saveRaw(key, data) {
  try {
    var pruned = pruneData(key, data);
    var json = JSON.stringify(pruned);
    // Warn if still large
    var kb = Math.round(json.length / 1024);
    if (kb > 4000) {
      console.warn('Data for', key, 'is', kb, 'KB — may hit localStorage quota');
    }
    localStorage.setItem(STORAGE_KEYS[key], json);
    var meta = loadMeta();
    meta[key] = { rows: data.length, savedAt: new Date().toISOString(), kb: kb };
    localStorage.setItem(STORAGE_META, JSON.stringify(meta));
  } catch(e) {
    console.warn('localStorage save failed:', e.message);
    // Show user-visible warning
    var w = document.getElementById('storage-warn');
    if (w) w.style.display = 'block';
  }
}
function loadMeta() {
  try { return JSON.parse(localStorage.getItem(STORAGE_META) || '{}'); } catch(e) { return {}; }
}
function loadAllRaw() {
  try {
    var stored = localStorage.getItem(STORAGE_KEYS['main']);
    if (stored) { raw['main'] = JSON.parse(stored); return true; }
  } catch(e) { console.warn('Failed to load main:', e.message); }
  return false;
}
function clearStorage() {
  localStorage.removeItem(STORAGE_KEYS['main']);
  localStorage.removeItem(STORAGE_META);
}
function fmtSavedAt(iso) {
  if (!iso) return '';
  try {
    var d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) +
           ' ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  } catch(e) { return iso.slice(0,16).replace('T',' '); }
}
var drillData = null;
window._sd = [];
window._dpStocks = [];
window._drillPreset = null;
window._drillLabel = null;
 
// ════════════════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════════════════
var TIER_ORDER = { 'HC': 0, 'Buy': 1, 'Hold': 2, 'Watch': 3, '': 4 };
 
var QUAL_FIELDS = [
  { key: 'moat',         col: 'moat' },
  { key: 'mgmt',         col: 'management quality' },
  { key: 'scalability',  col: 'scalability and expansion potential' },
  { key: 'rd',           col: 'r&d budget' },
  { key: 'customer',     col: 'customer base & loyalty' },
  { key: 'adaptability', col: 'adaptability to disruption' },
  { key: 'regulatory',   col: 'regulatory environment' },
  { key: 'brand',        col: 'brand & reputation' },
];
var QUAL_LABELS = {
  moat: 'Moat', mgmt: 'Management', scalability: 'Scalability',
  rd: 'R&D Budget', customer: 'Customer Base', adaptability: 'Adaptability',
  regulatory: 'Regulatory Env.', brand: 'Brand & Reputation'
};
 
// ════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════
function cN(v) {
  if (v === null || v === undefined || v === '' || v === '-' || v === '#N/A' || v === 'N/A') return null;
  if (typeof v === 'number') return isNaN(v) ? null : v;
  var s = String(v).trim();
  // Plain or scientific-notation numbers: parse directly (the fallback regex
  // below strips letters E/G/B/P from currency codes, which would corrupt e.g. "1.5e-3")
  if (/^-?\d*\.?\d+(e[+-]?\d+)?$/i.test(s)) { var d = parseFloat(s); return isNaN(d) ? null : d; }
  var n = parseFloat(s.replace(/[EUR$GBP%\s,]/gi, '').replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? null : n;
}
function pct(v, d) {
  if (v === null || v === undefined) return '-';
  d = d || 1;
  return (v * 100).toFixed(d) + '%';
}
/** '+12.3%' / '-4.0%' / em-dash for null. Input is a plain percentage number. */
function signedPct(n) {
  return n !== null ? (n > 0 ? '+' : '') + n.toFixed(1) + '%' : '\u2014';
}
/** Green above zero, red below, inherit at zero/null — the app-wide perf colour rule. */
function perfColor(n) {
  return n > 0 ? 'var(--green)' : n < 0 ? 'var(--red)' : 'inherit';
}
function fmtMktCap(v) {
  var n = cN(v);
  if (n === null) return '<span style="color:var(--muted)">—</span>';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'T';
  if (n >= 100)  return n.toFixed(0) + 'B';
  return n.toFixed(1) + 'B';
}
function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function sdot(v) {
  return '<span class="sdot sdot' + (v || 0) + '" title="' + (v ? 'Q' + v : '-') + '"></span>';
}
function qualDotBar(val) {
  // 1=best (green) → 4=worst (red)
  var colors = { 1: '#1e7e4a', 2: '#1a6a9a', 3: '#856404', 4: '#c0392b' };
  var labels = { 1: 'Excellent', 2: 'Good', 3: 'Average', 4: 'Weak' };
  var col = val ? colors[val] : 'var(--border)';
  var lbl = val ? labels[val] : '—';
  var html = '<div class="qual-score-dots">';
  // 4 squares: filled ones use the score color, empty ones are grey
  for (var i = 1; i <= 4; i++) {
    html += '<div class="qual-dot' + (val && i <= val ? ' qdot-filled-' + val : '') + '" title="' + i + '"></div>';
  }
  html += '</div>';
  html += '<span class="qual-score-num" style="color:' + col + '">' + (val || '—') + '</span>';
  html += '<span style="font-size:8px;color:' + col + ';font-weight:700;margin-left:6px;text-transform:uppercase;letter-spacing:.05em">' + (val ? lbl : '') + '</span>';
  return html;
}
function uCls(u) {
  if (u === null) return '';
  if (u >= 0.20) return 'uhi';
  if (u >= 0.10) return 'umed';
  if (u >= 0) return 'ulo';
  return 'uneg';
}
function qCls(q) { return ['q0', 'q1', 'q2', 'q3', 'q4'][q] || 'q0'; }
function tierCls(t) {
  return t === 'HC' ? 'tier-hc' : t === 'Buy' ? 'tier-buy' : t === 'Hold' ? 'tier-hold' : 'tier-watch';
}
function normalizeRegion(raw) {
  // Uses both the region text AND the country code from all_stocks or universe
  // Priority: try to match specific countries first, then broader regions
  var v = String(raw || '').trim().toUpperCase();
  if (!v) return 'Other';
 
  // ── Switzerland ──
  if (v === 'CH' || v === 'CHE' || v === 'SWITZERLAND' || v === 'SUISSE' || v === 'SWISS') return 'Switzerland';
 
  // ── UK ──
  if (v === 'UK' || v === 'GB' || v === 'GBR' || v === 'UNITED KINGDOM' || v === 'GREAT BRITAIN' || v === 'ENGLAND') return 'UK';
 
  // ── USA ──
  if (v === 'US' || v === 'USA' || v === 'UNITED STATES' || v === 'UNITED STATES OF AMERICA' || v === 'U.S.' || v === 'U.S.A.') return 'USA';
 
  // ── Canada ──
  if (v === 'CA' || v === 'CAN' || v === 'CANADA') return 'Canada';
 
  // ── Europe (continental) — common country codes + region labels ──
  var europeISO = ['DE','AUT','BE','BEL','DK','DNK','ES','ESP','FI','FIN','FR','FRA','GR','GRC',
                   'IE','IRL','IT','ITA','LU','LUX','NL','NLD','NO','NOR','PL','POL','PT','PRT',
                   'SE','SWE','AT','HU','HUN','CZ','CZE','RO','ROU','SK','SVK','SI','SVN',
                   'HR','HRV','BG','BGR','EE','EST','LT','LTU','LV','LVA','MT','MLT','CY','CYP',
                   'IS','ISL','LI','LIE'];
  if (europeISO.indexOf(v) > -1) return 'Europe';
  if (v === 'EUROPE' || v === 'EUROPEAN UNION' || v === 'EU' || v === 'EURO' ||
      v === 'EUROZONE' || v === 'CONTINENTAL EUROPE' || v === 'EUROPE EX UK') return 'Europe';
 
  // ── Partial matches for region text fields ──
  if (v.indexOf('SWITZ') > -1 || v.indexOf('SUISSE') > -1) return 'Switzerland';
  if (v.indexOf('UNITED KINGDOM') > -1 || v.indexOf('BRIT') > -1) return 'UK';
  if (v.indexOf('UNITED STATES') > -1 || v.indexOf('NORTH AMERICA') > -1) return 'USA';
  if (v.indexOf('CANADA') > -1) return 'Canada';
  if (v.indexOf('EUROPE') > -1 || v.indexOf('EURO') > -1) return 'Europe';
 
  return 'Other';
}
 
/** Regions that map 1:1 to a country — no country suffix needed in labels. */
var SINGLE_COUNTRY_REGIONS = ['USA', 'UK', 'Switzerland', 'Canada'];

function normalizeTier(v) {
  if (!v) return '';
  var u = String(v).trim().toUpperCase();
  if (u === 'HIGH CONVICTION' || u === 'HC') return 'HC';
  if (u === 'BUY' || u === 'STRONG BUY') return 'Buy';
  if (u === 'HOLD' || u === 'NEUTRAL') return 'Hold';
  if (u === 'SELL' || u === 'WATCH') return 'Watch';
  return v;
}
function isValidISIN(v) {
  if (!v) return false;
  var s = String(v).trim();
  if (s.length < 6) return false;
  var skip = ['YTD', 'N/A', '#N/A', 'ISIN', 'ID_ISIN', 'NAME', 'TICKER', 'SOURCE', 'DATE', '', 'SECURITIES', 'ERROR CODE'];
  if (skip.indexOf(s.toUpperCase()) > -1) return false;
  return /[A-Z0-9]{4,}/i.test(s);
}
 
// ════════════════════════════════════════════════════
// CSV PARSER — handles Bloomberg metadata rows
// ════════════════════════════════════════════════════
function parseCSV(text) {
  // ── Detect separator ──
  var firstLine = text.slice(0, 2000);
  var sep = firstLine.indexOf('\t') > -1 ? '\t' : (firstLine.indexOf(';') > -1 ? ';' : ',');
 
  // ── RFC 4180 tokenizer — handles quoted fields with embedded newlines/commas ──
  function tokenize(str, delimiter) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuote = false;
    var i = 0;
    while (i < str.length) {
      var ch = str[i];
      if (inQuote) {
        if (ch === '"') {
          if (str[i+1] === '"') { field += '"'; i += 2; continue; } // escaped quote
          else { inQuote = false; i++; continue; }
        }
        field += ch; i++;
      } else {
        if (ch === '"') { inQuote = true; i++; continue; }
        if (ch === delimiter) { row.push(field.trim()); field = ''; i++; continue; }
        if (ch === '\r' && str[i+1] === '\n') {
          row.push(field.trim()); rows.push(row); row = []; field = ''; i += 2; continue;
        }
        if (ch === '\n') {
          row.push(field.trim()); rows.push(row); row = []; field = ''; i++; continue;
        }
        field += ch; i++;
      }
    }
    if (field.trim() || row.length) { row.push(field.trim()); rows.push(row); }
    return rows;
  }
 
  var allRows = tokenize(text, sep);
  return buildRows(allRows);
}

// ── Parse an .xlsx / .xls workbook (binary) into row objects ──
// Reads the first sheet as an array-of-arrays via SheetJS, then reuses the
// exact same header-detection + normalization pipeline as the CSV path, so
// downstream field keys are identical regardless of source format.
function parseXLSX(arrayBuffer) {
  if (typeof XLSX === 'undefined') throw new Error('xlsx_lib_missing');
  var wb = XLSX.read(arrayBuffer, { type: 'array' });
  var ws = wb.Sheets[wb.SheetNames[0]];
  var aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  return buildRows(aoa);
}

// ── Shared: turn a raw array-of-arrays into ISIN-keyed row objects ──
function buildRows(allRows) {
  if (!allRows || allRows.length < 2) return [];

  // Find the real header (field-name) row within the first 8 rows. The
  // Bloomberg export stacks a section-title row above it, so we look for the
  // first row that actually contains an ISIN column.
  var headerIdx = 0;
  for (var i = 0; i < Math.min(8, allRows.length); i++) {
    var joined = allRows[i].join(' ').toLowerCase();
    if (joined.indexOf('id_isin') > -1 || joined.indexOf('isin') > -1 || joined.indexOf('securities') > -1) {
      headerIdx = i; break;
    }
  }

  // Normalize headers: lowercase, collapse whitespace, strip quotes
  var headers = allRows[headerIdx].map(function(h) {
    return String(h == null ? '' : h).toLowerCase().replace(/['"]/g, '').replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim();
  });

  // Deduplicate repeated header names (Bloomberg repeats e.g. Best PE, Price)
  // by appending _2, _3 — first occurrence keeps the clean key.
  var seen = {};
  headers = headers.map(function(h) {
    if (!h) return '_empty_' + Math.random();
    if (!seen[h]) { seen[h] = 1; return h; }
    seen[h]++;
    return h + '_' + seen[h];
  });

  var rows = allRows.slice(headerIdx + 1).map(function(cols) {
    return headers.reduce(function(acc, h, i) {
      acc[h] = String(cols[i] == null ? '' : cols[i]).trim();
      return acc;
    }, {});
  });

  // Keep only rows with a syntactically valid ISIN — this automatically
  // discards the Bloomberg mnemonic row and the "enter tickers" hint row.
  return rows.filter(function(r) {
    var isin = r['id_isin'] || r['isin'] || r['securities'] || '';
    return isValidISIN(isin);
  });
}
 
function getISIN(r) {
  return String(r['id_isin'] || r['isin'] || r['securities'] || '').trim().toUpperCase();
}
 
// Debug helper — call debugRaw('main') in browser console to inspect parsed columns

function handleFile(key, inp) {
  var file = inp.files && inp.files[0];
  if (!file) return;
  loadFileObject(file);
}

// Shared loader used by both the file input and drag-and-drop
function loadFileObject(file) {
  var name = (file.name || '').toLowerCase();
  var isExcel = /\.(xlsx|xlsm|xls)$/.test(name);
  var dz = document.getElementById('dropzone');
  if (dz) {
    dz.classList.remove('dragover');
    dz.innerHTML = '<div class="dz-ico"><span class="dz-spinner"></span></div>' +
      '<div class="dz-primary">Reading file…</div>' +
      '<div class="dz-secondary">' + esc(file.name) + '</div>';
  }
  var reader = new FileReader();
  reader.onerror = function() { uploadError('Could not read the file.'); };
  reader.onload = function(e) {
    try {
      var data = isExcel ? parseXLSX(e.target.result) : parseCSV(e.target.result);
      if (!data || !data.length) {
        uploadError('No valid securities detected (no ISIN recognised). Please check this is the BBG_RAW export.');
        return;
      }
      raw['main'] = data;
      saveRaw('main', data);
      runFusion();
    } catch (err) {
      uploadError(err && err.message === 'xlsx_lib_missing'
        ? 'The Excel reader could not load (internet connection required). Retry, or export the file as CSV.'
        : 'Read error: ' + ((err && err.message) || 'unrecognised format') + '.');
    }
  };
  if (isExcel) reader.readAsArrayBuffer(file); else reader.readAsText(file);
}

function uploadError(msg) {
  renderUpload();
  var e = document.getElementById('upload-err');
  if (e) { e.textContent = '\u26A0 ' + msg; e.classList.add('show'); }
}

// Drag-and-drop wiring for the dropzone
function dzDrop(ev) {
  ev.preventDefault();
  var el = document.getElementById('dropzone');
  if (el) el.classList.remove('dragover');
  var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
  if (f) loadFileObject(f);
}
function dzOver(ev) { ev.preventDefault(); var el = document.getElementById('dropzone'); if (el) el.classList.add('dragover'); }
function dzLeave(ev) { var el = document.getElementById('dropzone'); if (el) el.classList.remove('dragover'); }
 
// ════════════════════════════════════════════════════
// FUSION — single BBG_RAW file (Excel/CSV export), all fields in one pass // quant, qual
// ════════════════════════════════════════════════════
/**
 * MODEL — fusion step. Transforms raw parsed rows (raw.main) into the
 * derived `universe` array of security objects: field aliasing, tier
 * normalisation, risk flags, coverage badge, numeric precompute.
 * Idempotent: safe to call again after any file replacement.
 */
function runFusion() {
  if (!raw.main || !raw.main.length) return;

  universe = raw.main.map(function(r) {
    // ── helpers: read a field case-insensitively ──
    function g(keys) {
      for (var i = 0; i < keys.length; i++) {
        var v = r[keys[i]] !== undefined ? r[keys[i]] : r[keys[i].toLowerCase()];
        if (v !== undefined && v !== null && String(v).trim() !== '' &&
            String(v).indexOf('#N/A') === -1 && String(v) !== 'NaN') return String(v).trim();
      }
      return '';
    }

    var isinRaw = g(['ISIN','isin','ID_ISIN','id_isin']);
    if (!isinRaw) return null;

    // ── Tier from cfra Rating ──
    var ratingRaw = g(['cfra Rating','cfra rating']);
    var tier      = normalizeTier(ratingRaw);

    // ── Identity ──
    var name    = g(['Company Name','company name']);
    var ticker  = g(['Ticker','ticker']);
    var sector  = g(['GICS Sector','gics sector']);
    var industry= g(['Sub-Industry','sub-industry']);
    var country = g(['Country','country','COUNTRY_ISO','country_iso']);
    var region  = normalizeRegion(country);
    var crncy   = g(['Currency','currency','CRNCY','crncy']);
    var mktCap  = g(['Mkt Cap (USD bn)','mkt cap (usd bn)']);
    var coreSat = g(['Core / Satellite','core / satellite','core/satellite']);
    var esgRaw  = g(['ESG Leader','esg leader']);
    var esg     = (esgRaw && esgRaw !== '0' && esgRaw.toLowerCase() !== 'z') ? esgRaw : '';
    var prc     = cN(g(['PRC','prc']));
    var invested= g(['Invested (Y/N)','invested (y/n)']);
    var inUniverse = !!(g(['cfra investmenet universe','cfra investment universe']) || ratingRaw);

    // ── Pricing & targets ──
    var lastPx      = g(['Price','price']);
    var ptOverride  = g(['HC Target price','hc target price']);
    var ptCFRA      = g(['CFRA price Target','cfra price target']);
    var ptConsensus = g(['Analyst Target Price','analyst target price']);
    var target = tier === 'HC'
      ? (ptOverride || ptCFRA || ptConsensus)
      : (ptConsensus || ptCFRA);

    // ── Upside: file stores it as a decimal fraction (0.28 = 28%). Some
    // Bloomberg exports use a percentage number (28.0) instead — detect and
    // normalise both to a fraction so pct() renders correctly. ──
    var upsideRaw = g(['Analyst Upside %','analyst upside %']);
    var upside = cN(upsideRaw);
    if (upside !== null && Math.abs(upside) > 1.5) upside = upside / 100;

    // ── Performance — absolute. The BBG_RAW export labels these
    // "1M/3M/6M Price Performance" (not "Change %"), so map both. ──
    var ret1w = g(['1W Change %','1w change %']);
    var ret1m = g(['1M Change %','1m change %','1M Price Performance','1m price performance']);
    var ret3m = g(['3M change %','3m change %','3M Price Performance','3m price performance']);
    var ret6m = g(['6M Change %','6m change %','6M Price Performance','6m price performance']);
    var ret1y = g(['12M Change %','12m change %']);
    var ytdRet= g(['YTD Change %','ytd change %']);

    // ── Performance — relative (working) ──
    var perfRel1m = g(['Relative vs World 1M performance','relative vs world 1m performance']);
    var perfRel3m = g(['Relative World 3M performance','relative world 3m performance']);
    var perfRel6m = g(['Relative World 6M performance','relative world 6m performance']);
    var perfRel1y = g(['RELATIVE PERFORMANCE 12m EXL. Last month','relative performance 12m exl. last month']);
    var dist52hi  = g(['Distance to 52w high','distance to 52w high']);

    // ── Valuation ──
    var fwdPE    = g(['Best PE','best pe']);
    var evEbitda = g(['Best EV/EBITDA','best ev/ebitda']);
    var pbRatio  = g(['Best P/Book','best p/book']);
    var pSales   = g(['Price/Sales','price/sales']);
    var fcfYield = g(['FCF Yield','fcf yield']);
    var netDebtEb= g(['Net Debt / EBITDA','net debt / ebitda']);
    var divYield = g(['Indicated Dividend Yield','indicated dividend yield','Indicated Dividend Yild','indicated dividend yild','Dividend Yield','dividend yield','Div Yield','div yield','Gross Dividend Yield','gross dividend yield','EQY_DVD_YLD_IND','eqy_dvd_yld_ind','DVD_YLD_IND','dvd_yld_ind','Dividend Yield 12M','dividend yield 12m','DVD_YLD_12M','dvd_yld_12m']);
    var roe      = g(['ROE LF','roe lf','Return on Equity','return on equity']);
    var roa      = g(['ROA LF','roa lf','Return on Assets','return on assets']);
    var opm      = g(['Operating Margin','operating margin','OPM LF','opm lf']);

    // ── Quant scores ──
    var qCombined  = parseInt(g(['Combined Quartile','combined quartile'])) || 0;
    var qQuality   = parseInt(g(['Quality Q','quality q'])) || 0;
    var qProfitab  = parseInt(g(['Prof. Q','prof. q'])) || 0;
    var qGrowth    = parseInt(g(['Growth Q','growth q'])) || 0;
    var qValuation = parseInt(g(['Valuation Q','valuation q'])) || 0;
    var qBSCF      = parseInt(g(['BS&CF Q','bs&cf q'])) || 0;
    var qSentiment = parseInt(g(['Sentiment Q','sentiment q'])) || 0;
    var qEarnings  = parseInt(g(['Earnings Rev Q','earnings rev q'])) || 0;
    var qVL        = parseInt(g(['VL Value Creation Q','vl value creation q'])) || 0;
    var qMomentum  = parseInt(g(['Momentum Q','momentum q'])) || 0;
    var qValue     = qVL; // alias for legacy code
    var combinedScore = cN(g(['Combined Score','combined score']));

    // ── Technical ──
    var tech     = g(['Bollinger %B (30D)','bollinger %b (30d)','Bollinger %B','bollinger %b']);
    var techNum  = cN(tech);
    // Interpret Bollinger %B: >0.8 overbought, <0.2 oversold
    var techLabel = techNum !== null ? (techNum > 0.8 ? 'Overbought' : techNum < 0.2 ? 'Oversold' : 'Neutral') : '';
    var stopLoss = ''; // no longer in file

    // ── Crowding signals (NEW) ──
    var putCallRatio  = cN(g(['Put/Call Volume Ratio','put/call volume ratio']));
    var shortInterest = cN(g(['Short Interest Ratio','short interest ratio']));
    var revBreadth    = cN(g(['Net Revision Breadth','net revision breadth']));

    // ── EPS revisions ──
    var epsRev3m = g(['EPS Rev 3M','eps rev 3m']);
    var epsRev1m = g(['EPS Rev 4W','eps rev 4w']);

    // ── Growth ──
    var expGr   = g(['FY1-FY3 EPS CAGR','fy1-fy3 eps cagr']);
    var ytdRel  = perfRel1y; // best proxy

    // ── Coverage ──
    var hasQuant = qCombined > 0;
    var coverage = hasQuant ? 'quant' : 'basic';

    // ── Risk flags ──
    var flags = [];
    if (upside !== null && upside < CONFIG.risk.lowUpsideBelow) flags.push('Low Upside');
    if (qCombined >= 4) flags.push('Quant Q4');
    var fwdPEn = cN(fwdPE); if (fwdPEn && fwdPEn > CONFIG.risk.stretchedPEAbove) flags.push('Stretched P/E');
    if (ratingRaw.toLowerCase().indexOf('sell') > -1) flags.push('Sell');
    // Crowding flag: high P/C ratio + low short interest = crowded long
    if (putCallRatio !== null && putCallRatio > CONFIG.risk.crowdingPutCallAbove && shortInterest !== null && shortInterest < CONFIG.risk.crowdingShortIntBelow) flags.push('Crowding Risk');

    // Legacy qual scores (not in new file — keep structure for AI prompt compat)
    var qualScores = { moat: null, mgmt: null, scalability: null, rd: null,
                       customer: null, adaptability: null, regulatory: null, brand: null };
    var qualAvg = null;

    return {
      id_isin: isinRaw, ticker: ticker, name: name || isinRaw,
      region: region, sector: sector || 'Other', country: country, crncy: crncy,
      industry: industry,
      tier: tier, ratingRaw: ratingRaw, coverage: coverage,
      inUniverse: inUniverse, inAllStocks: inUniverse, hasQuant: hasQuant, hasQual: false,
      coreSat: coreSat, esg: esg, mktCap: mktCap, prc: prc, invested: invested,
      lastPx: lastPx, target: target, ptOverride: ptOverride, ptCFRA: ptCFRA, ptConsensus: ptConsensus,
      upside: upside, fwdPE: fwdPE, pbRatio: pbRatio, pSales: pSales,
      divYield: divYield, ytdRet: ytdRet, ytdRel: ytdRel, expGr: expGr,
      ret1w: ret1w, ret1m: ret1m, ret3m: ret3m, ret6m: ret6m, ret1y: ret1y,
      perfRel1m: perfRel1m, perfRel3m: perfRel3m, perfRel6m: perfRel6m, perfRel1y: perfRel1y,
      dist52hi: dist52hi,
      roe: roe, roa: roa, opm: opm, netDebtEb: netDebtEb, fcfYield: fcfYield, evEbitda: evEbitda,
      qCombined: qCombined, qValue: qValue, qEarnings: qEarnings,
      qQuality: qQuality, qProfitab: qProfitab, qGrowth: qGrowth,
      qBSCF: qBSCF, qValuation: qValuation, qSentiment: qSentiment,
      qVL: qVL, qMomentum: qMomentum, combinedScore: combinedScore,
      stopLoss: stopLoss, tech: techLabel, techNum: techNum,
      putCallRatio: putCallRatio, shortInterest: shortInterest, revBreadth: revBreadth,
      epsRev3m: epsRev3m, epsRev1m: epsRev1m,
      qualScores: qualScores, qualAvg: qualAvg,
      flags: flags,
      risk: flags.length >= CONFIG.risk.highAtFlags ? 'high' : flags.length === 1 ? 'medium' : 'low'
    };
  }).filter(Boolean);

  // Precompute the numeric view of string-typed fields once, so sorting and
  // filtering never re-parse formatted strings inside comparators
  // (~30k cN() calls saved per sort of the full universe).
  universe.forEach(function (s) {
    s.nums = {
      mktCap: cN(s.mktCap), fwdPE: cN(s.fwdPE), perfRel6m: cN(s.perfRel6m),
      evEbitda: cN(s.evEbitda), expGr: cN(s.expGr), divYield: cN(s.divYield),
      ytdRet: cN(s.ytdRet), fcfYield: cN(s.fcfYield), netDebtEb: cN(s.netDebtEb), roe: cN(s.roe),
    };
  });

  showView('macro');
}

/**

  if (v === 'momentum') { buildMomentum(); return; }
}

function openDrill(title, subtitle, stocks) {
  drillData = { title: title, subtitle: subtitle, stocks: stocks };
  document.getElementById('dp-title').textContent = title;
  document.getElementById('dp-subtitle').textContent = subtitle;
  document.getElementById('dp-count').textContent = stocks.length + (stocks.length === 1 ? ' security' : ' securities');
  renderDrillTable(stocks);
  document.getElementById('drill-panel').classList.add('open');
  var mw = document.querySelector('.macro-wrap');
  if (mw) mw.classList.add('shifted');
}
function closeDrill() {
  document.getElementById('drill-panel').classList.remove('open');
  var mw = document.querySelector('.macro-wrap');
  if (mw) mw.classList.remove('shifted');
  drillData = null;
  document.querySelectorAll('.kpi.active,.rrow.active,.brow.active,.tier-kpi.active').forEach(function(el) { el.classList.remove('active'); });
}
function renderDrillTable(stocks) {
  var sorted = stocks.slice().sort(function(a, b) {
    var ta = TIER_ORDER[a.tier] || 9, tb = TIER_ORDER[b.tier] || 9;
    if (ta !== tb) return ta - tb;
    return (b.upside || -999) - (a.upside || -999);
  });
  window._dpStocks = sorted;
  var rows = sorted.map(function(s, i) {
    var ytdN = cN(s.ytdRet);
    return '<tr onclick="openStockModal(window._dpStocks[' + i + '])">' +
      '<td><div class="dp-name">' + esc(s.name) + '</div><div class="dp-isin">' + esc(s.id_isin) + (s.ticker ? ' &middot; ' + esc(s.ticker) : '') + '</div></td>' +
      '<td><span class="tier ' + tierCls(s.tier) + '">' + esc(s.tier || '—') + '</span></td>' +
      '<td style="text-align:center"><span class="qb ' + qCls(s.qCombined) + '">' + (s.qCombined ? 'Q' + s.qCombined : '—') + '</span></td>' +
      '<td style="text-align:right"><span style="font-weight:700;color:' + (s.upside >= 0.15 ? 'var(--green)' : s.upside >= 0 ? 'var(--muted)' : 'var(--red)') + '">' + (s.upside !== null ? pct(s.upside) : '—') + '</span></td>' +
      '<td style="text-align:right;font-weight:700;font-size:10px">' + (cN(s.fwdPE) ? parseFloat(s.fwdPE).toFixed(1) + 'x' : '—') + '</td>' +
      '<td><span class="rb ' + (s.risk === 'high' ? 'rhi' : s.risk === 'medium' ? 'rme' : 'rlo') + '">' + s.risk + '</span></td>' +
      '</tr>';
  }).join('');
  document.getElementById('dp-body').innerHTML =
    '<table class="dp-table"><thead><tr>' +
    '<th>Name</th><th>Tier</th><th class="c">Q</th>' +
    '<th class="r">Upside</th><th class="r">P/E</th><th>Risk</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
}

var _namedDrills = {};
/**
 * DRILL CHANNEL — macro panels register click-through subsets by key;
 * drillNamed() resolves the key and opens the side panel, and
 * drillToScreen() hands the subset to the Screen view via
 * window._drillPreset (consumed once by buildScreen).
 */
function registerDrill(key, title, subtitle, filterFn) {
  _namedDrills[key] = {title: title, subtitle: subtitle, fn: filterFn};
}
function drillNamed(el, key) {
  var d = _namedDrills[key];
  if (!d) return;
  markActive(el);
  openDrill(d.title, d.subtitle, universe.filter(d.fn));
}

function buildMacro() {
  var total = universe.length;
  var inUniverse = universe; // all records are from equity universe
  var hc    = universe.filter(function(s) { return s.tier === 'HC'; });
  var buys  = universe.filter(function(s) { return s.tier === 'Buy'; });
  var holds = universe.filter(function(s) { return s.tier === 'Hold'; });
  var hiRisk = universe.filter(function(s) { return s.risk === 'high'; });
  var q1    = universe.filter(function(s) { return s.qCombined === 1; });
  // Upside averages — calculated on equity universe only (titles with upside defined)
  function avgUpside(arr) {
    var w = arr.filter(function(s) { return s.upside !== null; });
    return w.length ? { val: w.reduce(function(a, s) { return a + s.upside; }, 0) / w.length, cnt: w.length } : { val: null, cnt: 0 };
  }
  var univWithUpside = inUniverse.filter(function(s) { return s.upside !== null; });
  var avgUpObj    = avgUpside(inUniverse);
  var avgUp       = avgUpObj.val;
  var avgUpCnt    = avgUpObj.cnt;
  var hcAvgUpObj  = avgUpside(hc);
  var hcAvgUpV    = hcAvgUpObj.val;
  var buyAvgUpObj = avgUpside(buys);
  var buyAvgUpV   = buyAvgUpObj.val;
  var holdAvgUpObj= avgUpside(holds);
  var holdAvgUpV  = holdAvgUpObj.val;
 
  // Regions
  var regMap = {};
  inUniverse.forEach(function(s) {
    var r = s.region || 'Other';
    if (!regMap[r]) regMap[r] = { count: 0, upside: 0, upCnt: 0, hc: 0, hiRisk: 0 };
    regMap[r].count++;
    if (s.upside !== null) { regMap[r].upside += s.upside; regMap[r].upCnt++; }
    if (s.tier === 'HC') regMap[r].hc++;
    if (s.risk === 'high') regMap[r].hiRisk++;
  });
  var regions = Object.entries(regMap).map(function(e) {
    return { name: e[0], count: e[1].count, hc: e[1].hc, hiRisk: e[1].hiRisk, avgUp: e[1].upCnt ? e[1].upside / e[1].upCnt : null };
  }).sort(function(a, b) { return b.count - a.count; });
 
  // Sectors
  var secMap = {};
  inUniverse.forEach(function(s) {
    var sec = s.sector || 'Other';
    if (!secMap[sec]) secMap[sec] = { count: 0, upside: 0, upCnt: 0, hiRisk: 0, hc: 0, q1: 0 };
    secMap[sec].count++;
    if (s.upside !== null) { secMap[sec].upside += s.upside; secMap[sec].upCnt++; }
    if (s.risk === 'high') secMap[sec].hiRisk++;
    if (s.tier === 'HC') secMap[sec].hc++;
    if (s.qCombined === 1) secMap[sec].q1++;
  });
  var sectors = Object.entries(secMap).map(function(e) {
    return { name: e[0], count: e[1].count, hiRisk: e[1].hiRisk, hc: e[1].hc, q1: e[1].q1,
             q1share: e[1].count ? e[1].q1 / e[1].count : 0,
             avgUp: e[1].upCnt ? e[1].upside / e[1].upCnt : null };
  }).sort(function(a, b) { return b.count - a.count; });
  var maxC = Math.max.apply(null, sectors.map(function(s) { return s.count; }).concat([1]));
 
  // ── Quant Q1 concentration by sector (informative subset vs 25% baseline) ──
  var qConcH = sectors.filter(function(s) {
    return s.name && s.name.indexOf('#') === -1 && s.count >= 5;
  }).sort(function(a, b) {
    return b.q1share - a.q1share;
  }).map(function(s) {
    var key = 'secq1_' + s.name.replace(/[^a-zA-Z0-9]/g, '_');
    registerDrill(key, 'Q1 — ' + s.name, s.q1 + ' securities in Combined Q1',
      (function(sn) { return function(x) { return x.sector === sn && x.qCombined === 1; }; })(s.name));
    var pctv = s.q1share * 100;
    var above = s.q1share > 0.25;
    return '<div class="brow" onclick="drillNamed(this,\'' + key + '\')">' +
      '<span class="bname" style="width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(s.name) + '</span>' +
      '<div class="btrack" style="position:relative">' +
        '<div class="bfill ' + (above ? 'bf1' : 'bf3') + '" style="width:' + Math.min(100, (pctv / 50) * 100) + '%"></div>' +
        '<div style="position:absolute;top:-1px;bottom:-1px;left:50%;width:1px;background:var(--muted);opacity:.6"></div>' +
      '</div>' +
      '<span class="bmeta2">' + pctv.toFixed(0) + '% <span style="color:var(--muted);font-weight:400">(' + s.q1 + '/' + s.count + ')</span></span>' +
      '</div>';
  }).join('');
 
  // Qual averages
  var qualCov = universe.filter(function(s) { return s.qualAvg !== null; });
  var qualAvgH = qualCov.length ? QUAL_FIELDS.map(function(f) {
    var vals = qualCov.filter(function(s) { return s.qualScores[f.key] !== null; }).map(function(s) { return s.qualScores[f.key]; });
    var avg = vals.length ? vals.reduce(function(a, b) { return a + b; }, 0) / vals.length : null;
    var col = avg === null ? 'var(--muted)' : avg <= 1.5 ? 'var(--green)' : avg <= 2.5 ? 'var(--blue)' : avg <= 3.2 ? 'var(--accent-dark)' : 'var(--red)';
    return '<div class="qscore-item"><span class="qscore-lbl">' + QUAL_LABELS[f.key] + '</span>' +
      '<span class="qscore-val" style="color:' + col + '">' + (avg !== null ? avg.toFixed(1) : '—') + '</span></div>';
  }).join('') : '';
 
  // ── Register named drills (avoids apostrophe escaping in HTML attributes) ──
  registerDrill('all',      'Full reference list', total + ' securities',        function(s){ return true; });
  registerDrill('universe', 'Equity Universe',     inUniverse.length + ' CFRA-covered securities', function(s){ return true; });
  registerDrill('upside',   'Upside >= 15%',       'High-potential securities',  function(s){ return s.upside !== null && s.upside >= 0.15; });
  registerDrill('q1',       'Quant Q1',            'Top quartile',               function(s){ return s.qCombined === 1; });
  registerDrill('hirisk',   'High Risk',           '2+ risk flags',              function(s){ return s.risk === 'high'; });
  registerDrill('hc',       'High Conviction',     hc.length + ' HC securities', function(s){ return s.tier === 'HC'; });
  registerDrill('buy',      'Buy — CFRA',          buys.length + ' securities',  function(s){ return s.tier === 'Buy'; });
  registerDrill('hold',     'Hold — CFRA',         holds.length + ' securities', function(s){ return s.tier === 'Hold'; });
  registerDrill('refonly',  'Not in the investment universe', 'No CFRA rating',  function(s){ return !s.inAllStocks; });
 
  // ── KPI Row ──
  var kpiHtml =
    '<div class="kpi-row">' +
    '<div class="kpi" onclick="drillNamed(this,\'all\')">' +
    '<span class="kpi-hint">&#8594;</span><div class="kpi-lbl">Reference list</div><div class="kpi-val">' + total + '</div><div class="kpi-sub">All securities</div></div>' +

        '<span class="tip-bubble">' +
          '<span class="tip-title">How risk is classified</span>' +

          '<li><b>Low Upside</b> — analyst upside &lt; 8%</li>' +

  // ── Tier KPI Row ──

    '<div class="tier-kpi t-buy" onclick="drillNamed(this,\'buy\')">' +
    '<div class="tier-kpi-lbl">Buy — CFRA</div>' +
    '<div class="tier-kpi-val" style="color:var(--tier-buy)">' + buys.length + '</div>' +
    '<div class="tier-kpi-sub">Avg upside <b>' + pct(buyAvgUpV) + '</b> &middot; ' + buyAvgUpObj.cnt + ' with PT</div></div>' +
 
    '<div class="tier-kpi t-hold" onclick="drillNamed(this,\'hold\')">' +
    '<div class="tier-kpi-lbl">Hold — CFRA</div>' +
    '<div class="tier-kpi-val" style="color:var(--tier-hold)">' + holds.length + '</div>' +
    '<div class="tier-kpi-sub">Avg upside <b>' + pct(holdAvgUpV) + '</b> &middot; ' + holdAvgUpObj.cnt + ' with PT</div></div>' +
 
    '<div class="tier-kpi t-watch" onclick="drillNamed(this,\'refonly\')">' +
    '<div class="tier-kpi-lbl">Not in the investment universe</div>' +

  // ── Region rows ──
  var regH = regions.map(function(r) {
    var key = 'reg_' + r.name.replace(/[^a-zA-Z0-9]/g,'_');
    registerDrill(key, 'Region: '+r.name, r.count+' securities', (function(rn){return function(s){return s.region===rn;};})(r.name));
    return '<div class="rrow" onclick="drillNamed(this,\''+key+'\')">'+
      '<div><div class="rname">'+esc(r.name)+'</div>'+
      '<div class="rdet">'+r.count+' securities &middot; '+r.hc+' HC &middot; '+r.hiRisk+' risk</div></div>'+
      '<div class="rup '+(r.avgUp>0?'rpos':'rneg')+'">'+pct(r.avgUp)+' &rarr;</div>'+
      '</div>';
  }).join('');
 
  // ── Risk bars ──
  var riskB=[
    {lbl:'High Risk',k:'high',cls:'bf2'},
    {lbl:'Medium',k:'medium',cls:'bf3'},
    {lbl:'Clean',k:'low',cls:'bf1'}
  ].map(function(r){
    var cnt=universe.filter(function(s){return s.risk===r.k;}).length;
    var key='risk_'+r.k;
    registerDrill(key,'Risk: '+r.lbl,'',( function(rk){return function(s){return s.risk===rk;};})(r.k));
    return '<div class="brow" onclick="drillNamed(this,\''+key+'\')">'+
      '<span class="bname">'+r.lbl+'</span>'+
      '<div class="btrack"><div class="bfill '+r.cls+'" style="width:'+(total?(cnt/total*100):0)+'%"></div></div>'+
